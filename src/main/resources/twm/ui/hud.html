<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TWM HUD</title>
<style>
/* Прозрачный слой поверх игры: фон обязан остаться пустым, иначе HUD закроет мир.
   Оформление то же, что в меню («тушь и печать»): плашка тушью, волосяная рамка,
   бумажный текст, вермильон только на срочном.

   Кегль привязан сразу к ширине и высоте окна (как в меню) и домножается на масштаб
   из настроек — у ног весь экран чёрный, им нужен другой размер, чем рукам. */
html { font-size: calc(clamp(12px, min(0.92vw, 1.85vh), 30px) * var(--scale, 1)); }

:root {
    --paper:   #EDE7DC;
    --paper-2: #ABA396;
    --paper-3: #7C756A;
    --plate:   rgba(12, 10, 9, 0.9);
    --rule:    rgba(237, 231, 220, 0.16);
    --seal:    #E05C42;
    --head:    #D2A03F;
    --hands:   #7FA46B;
    --legs:    #6D8FB6;
    --sans: "TWM Sans", system-ui, "Segoe UI", Roboto, sans-serif;
    --mono: "TWM Mono", ui-monospace, Consolas, monospace;
    --ease: cubic-bezier(0.2, 0, 0, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: var(--sans);
    background: transparent;
    color: var(--paper);
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
}

svg { display: block; flex: none; }

body[data-role="head"]  { --tint: var(--head); }
body[data-role="hands"] { --tint: var(--hands); }
body[data-role="legs"]  { --tint: var(--legs); }

.plate {
    background: var(--plate);
    border: 1px solid var(--rule);
    border-radius: 2px;
}

/* --- Знак роли ---------------------------------------------------------- */

.badge {
    position: absolute;
    top: 1rem;
    left: 1rem;
    display: none;
    align-items: center;
    gap: 0.6rem;
    padding: 0.45rem 0.9rem 0.45rem 0.65rem;
    border-left: 2px solid var(--tint, var(--paper-3));
}

.badge.on { display: flex; }
.badge svg { width: 1.15rem; height: 1.15rem; color: var(--tint, var(--paper-2)); }
.badge .name { font-size: 0.85rem; font-weight: 500; }
.badge .mode { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.1em; color: var(--paper-3); margin-top: 0.05rem; }

/* Голос: микрофон и ухо — что роли можно прямо сейчас. Перечёркнутый знак берёт
   вермильон, потому что это правило игры, а не украшение; тусклый знак означает,
   что голосового чата нет вовсе, и тогда цветом отмечать нечего. */
.badge .voice { display: none; align-items: center; gap: 0.4rem; margin-left: 0.15rem; padding-left: 0.65rem; border-left: 1px solid var(--rule); }
.badge .voice.on { display: flex; }
.badge .voice svg { width: 0.95rem; height: 0.95rem; color: var(--paper-3); }
.badge .voice .off svg { color: var(--seal); }
.badge .voice .mute svg { opacity: 0.28; }

/* --- Лобби и подбор ----------------------------------------------------- */

/* Показывается только вне игры: во время забега на экране не должно быть ничего
   лишнего, особенно у ног, где каждый светлый пиксель отвлекает от контуров. */
.status {
    position: absolute;
    left: 1rem;
    bottom: 1rem;
    display: none;
    align-items: center;
    gap: 0.65rem;
    padding: 0.5rem 1rem 0.5rem 0.5rem;
}

.status.on { display: flex; }
.status .avatar { width: 2rem; height: 2rem; border-radius: 2px; background: rgba(237, 231, 220, 0.08); image-rendering: pixelated; display: grid; place-items: center; font-size: 0.8rem; font-weight: 500; color: var(--paper-3); overflow: hidden; }
.status .avatar img { width: 100%; height: 100%; image-rendering: pixelated; }
.status .who { font-size: 0.85rem; font-weight: 500; }
.status .what { margin-top: 0.05rem; font-size: 0.7rem; color: var(--paper-3); }

/* Единственная бесконечная анимация HUD и то лишь пока идёт подбор. */
.arc { width: 1.2rem; height: 1.2rem; flex: none; position: relative; display: none; }
.status.searching .arc { display: block; }
.arc::before, .arc::after { content: ""; position: absolute; inset: 0; border-radius: 50%; }
.arc::before { border: 1px solid var(--rule); }
.arc::after { border: 1px solid transparent; border-top-color: var(--seal); animation: turn 2.2s linear infinite; }

@keyframes turn { to { transform: rotate(360deg); } }

/* --- Мысли -------------------------------------------------------------- */

/* Мысли получают только ноги, а у них весь экран чёрный. Поэтому центр снизу и
   крупный кегль: это единственная связь с командой, читаться должна мгновенно
   и не спорить с белыми контурами эхолокации. */
.thoughts {
    position: absolute;
    left: 50%;
    bottom: 3.2rem;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
    width: min(42rem, 84vw);
}

/* Плашка мысли плотнее остальных: на чёрном экране ног сквозь полупрозрачный фон
   просвечивают контуры эхолокации и рвут крупную подпись. */
.thought {
    position: relative;
    background: rgba(9, 8, 7, 0.97);
    width: 100%;
    padding: 0.65rem 1.3rem 0.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.9rem;
    overflow: hidden;
    animation: appear 0.18s var(--ease);
}

@keyframes appear {
    from { opacity: 0; transform: translateY(0.5rem); }
    to   { opacity: 1; transform: none; }
}

.thought svg { width: 2rem; height: 2rem; color: var(--paper-2); transition: width 0.14s var(--ease), height 0.14s var(--ease); }
.thought .label { font-size: 2rem; font-weight: 600; letter-spacing: 0.01em; line-height: 1.1; transition: font-size 0.14s var(--ease); }

/* Полоса жизни: игрок видит, сколько мысль ещё провисит, и не переспрашивает. */
.thought .life {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 2px;
    background: var(--paper-3);
    transition: width 0.12s linear;
}

.thought.direction svg, .thought.direction .label { color: #CFE0EE; }
.thought.direction .life { background: var(--legs); }

.thought.command {
    border-color: rgba(224, 92, 66, 0.55);
    animation: appear 0.18s var(--ease), urge 1.4s var(--ease) infinite;
}

.thought.command svg, .thought.command .label { color: var(--seal); }
.thought.command .life { background: var(--seal); }

@keyframes urge { 50% { border-color: rgba(224, 92, 66, 0.18); } }

.thought.state svg, .thought.state .label { color: #E8CF9A; }
.thought.state .life { background: var(--head); }

/* Прошлая мысль остаётся подсказкой, но не спорит за внимание с последней.
   Гасится содержимое, а не карточка целиком: `opacity` на всей карточке разбавляет
   и её фон, и сквозь мысль начинают просвечивать контуры эхолокации. */
.thought.old { padding: 0.35rem 1rem 0.5rem; }
.thought.old .label { font-size: 1.05rem; color: var(--paper-3); }
.thought.old svg { width: 1.05rem; height: 1.05rem; color: var(--paper-3); }
.thought.old .life { background: rgba(237, 231, 220, 0.22); }
.thought.old.command { border-color: rgba(224, 92, 66, 0.3); animation: appear 0.18s var(--ease); }

/* --- Эхо-пинг ----------------------------------------------------------- */

.ping {
    position: absolute;
    right: 1rem;
    bottom: 1rem;
    display: none;
    align-items: center;
    gap: 0.55rem;
    padding: 0.42rem 0.95rem;
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--paper-3);
}

.ping.on { display: flex; }
.ping.ready { color: var(--paper-2); border-color: rgba(109, 143, 182, 0.5); }
.ping kbd { font-family: inherit; color: var(--paper); border: 1px solid var(--rule); border-radius: 2px; padding: 0.05rem 0.4rem; }

/* --- Тоасты ------------------------------------------------------------- */

.toasts {
    position: absolute;
    top: 1rem;
    right: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    align-items: flex-end;
}

.toast {
    min-width: 14rem;
    max-width: 22rem;
    padding: 0.6rem 0.95rem;
    border-left: 2px solid var(--paper-3);
    animation: slide-in 0.18s var(--ease);
}

.toast.out { animation: slide-out 0.22s var(--ease) forwards; }
.toast .t-title { font-size: 0.8rem; font-weight: 500; }
.toast .t-text { margin-top: 0.12rem; font-size: 0.72rem; color: var(--paper-3); line-height: 1.45; }
.toast[data-kind="success"] { border-left-color: var(--hands); }
.toast[data-kind="warning"] { border-left-color: var(--head); }
.toast[data-kind="error"]   { border-left-color: var(--seal); }
.toast[data-kind="invite"]  { border-left-color: var(--head); }

@keyframes slide-in  { from { opacity: 0; transform: translateX(0.8rem); } to { opacity: 1; transform: none; } }
@keyframes slide-out { to { opacity: 0; transform: translateX(0.8rem); } }
</style>

    var EAR = '<path d="M8.2 8.8a3.8 3.8 0 0 1 7.6 0c0 2.1-1.5 2.9-2.5 4-.8.9-.7 2-.7 2.9a2.2 2.2 0 0 1-4.4 0"/><path d="M11.1 8.9a.9.9 0 0 1 1.8 0c0 1-.9 1.3-.9 2.3"/>';
    var STRIKE = '<path d="M4.6 19.4 19.4 4.6"/>';

    /* Знак получают только направления и срочные команды: слепой читает стрелку быстрее
       слова. Остальным мыслям значок не нужен — крупной подписи достаточно, а лишний
       значок пришлось бы заучивать. Рисуем сами: юникодные стрелки уехали бы на системный
       шрифт и сломали ритм строки. */
    var GLYPHS = {
        forward:  '<path d="M12 20V4.6M5.6 11 12 4.6 18.4 11"/>',
        backward: '<path d="M12 4v15.4M5.6 13 12 19.4 18.4 13"/>',
        left:     '<path d="M20 12H4.6M11 5.6 4.6 12 11 18.4"/>',
        right:    '<path d="M4 12h15.4M13 5.6 19.4 12 13 18.4"/>',
        up:       '<path d="M4.5 4.2h15M12 20.5V8.6M7 13.6 12 8.6l5 5"/>',
        down:     '<path d="M4.5 19.8h15M12 3.5v11.9M7 10.4l5 5 5-5"/>',
        attack:   '<path d="M12 3.5v17M3.5 12h17M6 6l12 12M18 6 6 18"/>',
        // Поднятая ладонь, а не квадрат: пустой квадрат читается как значок, который не
        // прогрузился, — и читается так первым же взглядом, ради которого он и нарисован.
        // Знак тот же, что у роли рук: «стой» — это жест, а не фигура.
        stop:     '<path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/>'
                  + '<path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/>'
                  + '<path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/>'
                  + '<path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>',
        run:      '<path d="M4 6.5 10 12l-6 5.5M13 6.5 19 12l-6 5.5"/>'
    };

    /* Свой маленький словарь вместо запроса в мод: HUD обновляется каждый тик, и ходить
       за пятью подписями через мост на каждом кадре было бы дороже, чем держать их здесь.
       Код языка приезжает в том же состоянии — отдельный канал для него не нужен. */
    var I18N = {
        ru: {
            "role.head": "Голова", "role.hands": "Руки", "role.legs": "Ноги",
            "diff.easy": "лёгкая", "diff.hard": "сложная",
            "ping.ready": "эхо-пинг готов", "ping.cooldown": "перезарядка",
            "status.none": "не в комнате · открыть меню",
            "status.queue": "подбор %s / %s",
            "status.lobby": "%s · %s / %s"
        },
        en: {
            "role.head": "Head", "role.hands": "Hands", "role.legs": "Legs",
            "diff.easy": "easy", "diff.hard": "hard",
            "ping.ready": "echo ping ready", "ping.cooldown": "recharging",
            "status.none": "not in a room · open the menu",
            "status.queue": "matchmaking %s / %s",
            "status.lobby": "%s · %s / %s"
        }
    };

    var lang = "ru";

    function t(key) {
        var table = I18N[lang] || I18N.ru;
        var value = table[key];
        if (value === undefined) { value = I18N.ru[key]; }
        if (value === undefined) { return key; }
        for (var i = 1; i < arguments.length; i++) {
            value = value.replace("%s", arguments[i]);
        }
        return value;
    }

    function svg(paths, className) {
        var node = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        node.setAttribute("viewBox", "0 0 24 24");
        node.setAttribute("fill", "none");
        node.setAttribute("stroke", "currentColor");
        node.setAttribute("stroke-width", "1.6");
        node.setAttribute("stroke-linecap", "round");
        node.setAttribute("stroke-linejoin", "round");
        if (className) { node.setAttribute("class", className); }
        node.innerHTML = paths;
        return node;
    }

    function set(data) {
        if (data.lang) { lang = data.lang; }
        document.body.dataset.role = data.role || "";

        var hud = data.hud || {};
        document.documentElement.style.setProperty("--scale", hud.scale || 1);

        var badge = document.getElementById("badge");
        var mark = MARKS[data.role];
        badge.classList.toggle("on", !!mark);
        if (mark) {
            var host = document.getElementById("badge-mark");
            if (host.dataset.role !== data.role) {
                host.dataset.role = data.role;
                host.innerHTML = "";
                host.appendChild(svg(mark));
            }
            document.getElementById("badge-name").textContent = t("role." + data.role);
            document.getElementById("badge-mode").textContent = t("diff." + data.difficulty);
        }

        renderVoice(data);
        renderStatus(data);
        renderThoughts(data.thoughts || []);

        var ping = document.getElementById("ping");
        ping.classList.toggle("on", data.role === "legs" && data.difficulty === "hard");
        ping.classList.toggle("ready", !!data.pingReady);
        document.getElementById("ping-text").textContent =
                t(data.pingReady ? "ping.ready" : "ping.cooldown");
        // Клавиша могла быть переназначена в настройках — подпись обязана совпадать с биндом.
        if (hud.pingKey) { document.getElementById("ping-key").textContent = hud.pingKey; }
    }

    /* Пересобирается только при смене состояния: знак голоса не меняется по двадцать раз
       в секунду, а перерисовка каждый тик — это тот же дребезг, что был у панели мыслей. */
    function renderVoice(data) {
        var host = document.getElementById("voice");
        if (!data.role) {
            host.classList.remove("on");
            host.dataset.sign = "";
            return;
        }
        var voice = data.voice || {};
        var speak = voice.speak !== false;
        var hear = voice.hear !== false;
        var ready = voice.ready === true;
        var sign = [speak, hear, ready].join("|");
        host.classList.add("on");
        if (host.dataset.sign === sign) { return; }
        host.dataset.sign = sign;
        host.innerHTML = "";
        host.appendChild(voiceMark(MIC, speak, ready));
        host.appendChild(voiceMark(EAR, hear, ready));
    }

    function voiceMark(paths, allowed, ready) {
        var slot = document.createElement("span");
        slot.className = allowed ? (ready ? "" : "mute") : "off";
        slot.appendChild(svg(allowed ? paths : paths + STRIKE));
        return slot;
    }

    function renderStatus(data) {
        var status = document.getElementById("status");
        var playing = data.phase === "playing";
        status.classList.toggle("on", !playing);
        status.classList.toggle("searching", data.phase === "queue");
        if (playing) { return; }

        var self = data.self || {};
        document.getElementById("status-who").textContent = self.name || "—";

        var what = t("status.none");
        if (data.phase === "queue" && data.queue) {
            what = t("status.queue", data.queue.size, data.queue.needed);
        } else if (data.lobby) {
            what = t("status.lobby", data.lobby.name, data.lobby.players, data.lobby.max);
        }
        document.getElementById("status-what").textContent = what;

        var avatar = document.getElementById("status-avatar");
        if (self.avatar) {
            if (avatar.dataset.src !== self.avatar) {
                avatar.dataset.src = self.avatar;
                avatar.innerHTML = "";
                var image = document.createElement("img");
                image.src = self.avatar;
                avatar.appendChild(image);
            }
        } else if (!avatar.dataset.src) {
            avatar.textContent = (self.name || "?").charAt(0).toUpperCase();
        }
    }

    /* Карточки живут между обновлениями и находятся по ключу мысли.

       Прежняя версия сносила `innerHTML` и собирала список заново. Состояние приходит
       каждый тик — в нём убывает остаток жизни, — поэтому карточка пересоздавалась
       двадцать раз в секунду, и каждый раз заново запускалась анимация появления
       с нулевой прозрачности. Это и выглядело как мерцающая и затемнённая панель мыслей.
       Причина была не в GL, не в шейдере и не в смешивании: чинить это в рендере
       браузера бессмысленно, страница обязана обновлять только то, что изменилось. */
    var cards = {};

    function renderThoughts(thoughts) {
        var host = document.getElementById("thoughts");
        var visible = thoughts.slice(-2);
        var alive = {};

        visible.forEach(function (thought, index) {
            var key = String(thought.key);
            alive[key] = true;
            var card = cards[key];
            if (!card) {
                card = buildThought(thought);
                cards[key] = card;
                host.appendChild(card.node);
            }
            var share = thought.maxTicks ? Math.max(0, thought.ticks / thought.maxTicks) : 1;
            card.life.style.width = (share * 100) + "%";
            card.node.classList.toggle("old", index !== visible.length - 1);
        });

        Object.keys(cards).forEach(function (key) {
            if (alive[key]) { return; }
            cards[key].node.remove();
            delete cards[key];
        });
    }

    function buildThought(thought) {
        var node = document.createElement("div");
        node.className = "thought plate " + (thought.group || "action");

        var glyph = GLYPHS[thought.id];
        if (glyph) { node.appendChild(svg(glyph)); }

        var label = document.createElement("div");
        label.className = "label";
        label.textContent = thought.label;
        node.appendChild(label);

        var life = document.createElement("div");
        life.className = "life";
        node.appendChild(life);

        return { node: node, life: life };
    }

    function toast(data) {
        var host = document.getElementById("toasts");
        var card = document.createElement("div");
        card.className = "toast plate";
        card.dataset.kind = data.kind || "info";

        var title = document.createElement("div");
        title.className = "t-title";
        title.textContent = data.title || "";
        card.appendChild(title);

        if (data.text) {
            var text = document.createElement("div");
            text.className = "t-text";
            text.textContent = data.text;
            card.appendChild(text);
        }

        host.appendChild(card);
        // Никаких обращений к необъявленным переменным до этой строки: страница работает
        // в strict mode, и одна такая ошибка убивала весь остаток функции — тоаст
        // оставался висеть навсегда, потому что снятие по таймеру не успевало встать.
        window.setTimeout(function () {
            card.classList.add("out");
            window.setTimeout(function () { card.remove(); }, 240);
        }, 6000);
        while (host.children.length > 3) { host.firstChild.remove(); }
    }

    window.twmHud = { set: set, toast: toast };
})();
</script>
</body>
</html>
