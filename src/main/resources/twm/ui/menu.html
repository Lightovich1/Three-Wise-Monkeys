    var ECHO_COLORS = ["#EDE7DC", "#9FD8E4", "#C8452F", "#D2A03F", "#7FA46B", "#B9A7D6"];

    var PAGE_ICON = {
        main: "arrow", lobbies: "rooms", create: "rooms", lobby: "team",
        thoughts: "mind", guide: "book", settings: "sliders"
    };

    // --- Мост -------------------------------------------------------------

    function send(request) {
        if (window.cefQuery) {
            window.cefQuery({
                request: JSON.stringify(request),
                onSuccess: function () {},
                onFailure: function () {}
            });
        }
    }

    /* Звук играет мод, а не страница: у Chromium свой аудиовыход мимо микшера игры.
       Здесь остаётся только намерение — «это было наведение», «это был выбор». */
    function sfx(name) {
        send({ cmd: "ui", sound: name });
    }

    function lobby(action, argument) {
        send({ cmd: "lobby", action: action, arg: argument === undefined ? "" : argument });
    }

    function setting(path, value) {
        send({ cmd: "settings", action: "set", path: path, value: value });
    }

    // --- Мелкие помощники -------------------------------------------------

    function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) { node.className = className; }
        if (text !== undefined && text !== null) { node.textContent = text; }
        return node;
    }

    function button(text, className, handler) {
        var node = el("button", className, text);
        node.addEventListener("click", handler);
        return node;
    }

    function iconButton(name, title, className, handler) {
        var node = el("button", className);
        node.title = title;
        node.appendChild(icon(name));
        node.addEventListener("click", handler);
        return node;
    }

    function block(title, content) {
        var node = el("div", "block");
        if (title) {
            var head = el("div", "block-head");
            head.appendChild(el("div", "label", title));
            node.appendChild(head);
        }
        if (content) { node.appendChild(content); }
        return node;
    }

    function tag(iconName, text, className) {
        var node = el("div", "tag " + (className || ""));
        if (iconName) { node.appendChild(icon(iconName)); }
        node.appendChild(el("span", "", text));
        return node;
    }

    /* Аватарка: пока скин не приехал из мода, показываем инициал — страница обязана
       выглядеть законченной и без картинки, загрузка скина асинхронна по своей природе.
       Запрос по одному ключу уходит один раз: render() зовётся часто, а мод каждый вызов
       лезет в GL-текстуру скина. */
    function avatarNode(name, uuid, className) {
        var key = uuid || name;
        var source = state.avatars[key] || state.avatars[name];
        if (source) {
            var image = el("img", "avatar " + (className || ""));
            image.src = source;
            image.alt = name || "";
            return image;
        }
        if (key && !state.asked[key]) {
            state.asked[key] = true;
            send({ cmd: "avatar", uuid: uuid || "", name: name || "" });
        }
        return el("div", "avatar avatar-stub " + (className || ""), (name || "?").charAt(0).toUpperCase());
    }

    function roleDot(role) {
        var node = el("i", "me-role");
        node.style.background = "var(--" + role + ")";
        return node;
    }

    function selfName() {
        return (state.snapshot && state.snapshot.self && state.snapshot.self.name) || "";
    }

    function myRole() {
        var data = state.snapshot && state.snapshot.lobby;
        if (!data) { return ""; }
        var mine = (data.members || []).filter(function (member) { return member.self; })[0];
        return (mine && mine.role) || "";
    }

    function countRooms() {
        var lobbies = (state.snapshot && state.snapshot.lobbies) || [];
        var free = 0;
        lobbies.forEach(function (entry) { if (entry.joinable) { free++; } });
        return { total: lobbies.length, free: free };
    }

    // --- Навигация --------------------------------------------------------

    function show(name) {
        state.screen = name;
        if (name === "tutorial") {
            // Обучение всегда начинается сначала: оно показывается в начале забега, а забег —
            // это новый расклад ролей, даже если игрок открыл его вручную из справки.
            state.tutor.step = 0;
            state.tutor.seen = 0;
        }
        if (name === "thoughts") {
            state.wheel.branch = "";
            state.wheel.hover = -1;
            state.wheel.hub = -1;
        }
        render();
    }

    /** Режим сервера: решение владельца сервера, приходит в снимке и никогда не выдумывается. */
    function menuLocked() {
        var snapshot = state.snapshot;
        if (!snapshot || !snapshot.mode || !snapshot.mode.lockMenu) { return false; }
        return snapshot.phase !== "playing";
    }

    /** Главный экран заперного меню — тот, с которого Esc уводит в паузу, а не назад. */
    function isHomeScreen() {
        var inLobby = !!(state.snapshot && state.snapshot.lobby);
        return state.screen === (inLobby ? "lobby" : "main");
    }

    function renderNav() {
        var host = document.getElementById("nav");
        host.innerHTML = "";
        var snapshot = state.snapshot;
        var rooms = countRooms();
        var invites = (snapshot && snapshot.invites) || [];
        var inLobby = !!(snapshot && snapshot.lobby);

        var items = [
            { id: "main", icon: "arrow", dot: invites.length > 0 },
            { id: "lobbies", icon: "rooms", count: rooms.total || null }
        ];
        // Пункт владельца сервера — сразу под комнатами. Подпись приходит с сервера, и
        // если её нет (чужой сервер, одиночная игра), пункта не существует вовсе.
        var announce = (snapshot && snapshot.announce) || null;
        if (announce && announce.navLabel) {
            items.push({ id: "network", icon: "back", label: announce.navLabel,
                    action: function () { lobby("network_connect", "nav"); } });
        }
        if (inLobby) { items.push({ id: "lobby", icon: "team" }); }
        items.push({ gap: true });
        items.push({ id: "thoughts", icon: "mind" });
        items.push({ id: "guide", icon: "book" });
        items.push({ id: "settings", icon: "sliders" });

        items.forEach(function (item) {
            if (item.gap) {
                host.appendChild(el("div", "nav-gap"));
                return;
            }
            var active = state.screen === item.id
                    || (item.id === "lobbies" && state.screen === "create");
            var node = el("button", active ? "on" : "");
            node.appendChild(icon(item.icon));
            node.appendChild(el("span", "", item.label || t("page." + item.id)));
            if (item.dot) { node.appendChild(el("i", "nav-dot")); }
            else if (item.count) { node.appendChild(el("div", "nav-count", String(item.count))); }
            node.addEventListener("click", item.action || function () { show(item.id); });
            host.appendChild(node);
        });
    }

    function renderHead() {
        document.getElementById("page-title").textContent = t("page." + state.screen);
        document.getElementById("page-note").textContent = "";

        var actions = document.getElementById("page-actions");
        actions.innerHTML = "";
        if (state.screen === "create") {
            actions.appendChild(iconButton("back", t("nav.back_to_list"), "btn icon-btn btn-quiet",
                    function () { show("lobbies"); }));
        }
        var escape = el("div", "esc");
        escape.appendChild(el("b", "", "Esc"));
        // Пока меню заперто, Esc не закрывает его в мир: с главного экрана он открывает
        // ванильную паузу (выход с сервера обязан оставаться доступен), с остального —
        // возвращает на главный. Подпись обязана называть то, что произойдёт на самом деле.
        escape.appendChild(el("span", "", t(menuLocked()
                ? (isHomeScreen() ? "rail.esc_locked" : "rail.esc_back")
                : "rail.esc")));
        actions.appendChild(escape);
    }

    // --- Переключатель языка ----------------------------------------------

    /* Правый нижний угол, список раскрывается вверх — вниз ему некуда, он и так у пола.

       Выбора «как в игре» в списке нет. Он существует как начальное значение настройки:
       мод сам смотрит на язык игры, пока игрок не сказал иначе. Отдельной кнопкой это
       было лишним третьим состоянием — язык либо угадан правильно, и трогать нечего,
       либо не угадан, и тогда нужен конкретный язык, а не «угадывай дальше».

       Флаг рисуется, а не берётся эмодзи: эмодзи-флаг уезжает на системный шрифт, а на
       части машин его просто нет — вместо флага остаются две буквы кода страны. */
    var FLAGS = {
        ru: '<rect width="20" height="14" rx="1" fill="#E8E2D8"/>'
            + '<path d="M0 4.7h20v4.6H0z" fill="#37518C"/>'
            + '<path d="M0 9.3h20V13a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1z" fill="#C0392B"/>',
        en: '<rect width="20" height="14" rx="1" fill="#E8E2D8"/>'
            + '<path d="M0 0h20v2H0zM0 4h20v2H0zM0 8h20v2H0zM0 12h20v2H0z" fill="#C0392B"/>'
            + '<path d="M0 1a1 1 0 0 1 1-1h8v6H0z" fill="#37518C"/>'
            + '<g fill="#E8E2D8"><circle cx="2" cy="1.4" r=".45"/><circle cx="4.5" cy="1.4" r=".45"/>'
            + '<circle cx="7" cy="1.4" r=".45"/><circle cx="3.25" cy="3" r=".45"/>'
            + '<circle cx="5.75" cy="3" r=".45"/><circle cx="2" cy="4.6" r=".45"/>'
            + '<circle cx="4.5" cy="4.6" r=".45"/><circle cx="7" cy="4.6" r=".45"/></g>'
    };

    function flag(code) {
        var node = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        node.setAttribute("viewBox", "0 0 20 14");
        node.setAttribute("class", "flag");
        node.innerHTML = FLAGS[code] || "";
        return node;
    }

    function renderLang() {
        var host = document.getElementById("lang");
        host.innerHTML = "";
        host.classList.remove("open");
        host.title = t("lang.title");

        // Подсвечивается действующий язык, а не выбранный: пока выбора не было, в кнопке
        // обязан стоять тот флаг, который игрок сейчас видит на экране.
        var current = el("button", "lang-current");
        current.appendChild(flag(state.lang));
        current.appendChild(el("span", "", state.lang.toUpperCase()));
        current.appendChild(icon("caret"));
        current.addEventListener("click", function (event) {
            event.stopPropagation();
            host.classList.toggle("open");
        });
        host.appendChild(current);

        var list = el("div", "lang-list");
        state.langOptions.forEach(function (option) {
            var node = el("button", state.lang === option.code ? "on" : "");
            node.appendChild(flag(option.code));
            node.appendChild(el("span", "", option.name));
            node.addEventListener("click", function (event) {
                event.stopPropagation();
                host.classList.remove("open");
                if (state.langChoice === option.code) { return; }
                setting("ui.language", option.code);
            });
            list.appendChild(node);
        });
        host.appendChild(list);
    }

    // Клик мимо списка закрывает его: открытый список поверх меню перехватывал бы взгляд.
    document.addEventListener("click", function () {
        var host = document.getElementById("lang");
        if (host) { host.classList.remove("open"); }
    });

    // --- Модальные окна ---------------------------------------------------

    function closeModal() {
        var root = document.getElementById("modal-root");
        root.classList.remove("open");
        root.innerHTML = "";
    }

    function openModal(build) {
        var root = document.getElementById("modal-root");
        root.innerHTML = "";
        var box = el("div", "modal");
        build(box);
        root.appendChild(box);
        root.classList.add("open");
        var input = box.querySelector("input");
        if (input) { input.focus(); }
    }

    function passwordModal(entry) {
        openModal(function (box) {
            box.appendChild(el("h3", "", t("modal.private")));
            box.appendChild(el("p", "", t("modal.private_text", entry.name, entry.host)));
            var body = el("div", "modal-body");
            var field = el("div", "field");
            var input = el("input");
            input.type = "password";
            input.placeholder = t("modal.password");
            input.maxLength = 32;
            field.appendChild(input);
            body.appendChild(field);
            var error = el("div", "modal-error", "");
            body.appendChild(error);
            box.appendChild(body);

            function submit() {
                if (!input.value) {
                    error.textContent = t("modal.password_empty");
                    return;
                }
                lobby("join", JSON.stringify({ code: entry.code, password: input.value }));
                closeModal();
            }

            input.addEventListener("keydown", function (event) {
                if (event.key === "Enter") { submit(); }
            });

            var actions = el("div", "modal-actions");
            actions.appendChild(button(t("modal.cancel"), "btn btn-quiet", closeModal));
            actions.appendChild(button(t("modal.enter"), "btn btn-primary", submit));
            box.appendChild(actions);
        });
    }

    function inviteModal() {
        var data = state.snapshot && state.snapshot.lobby;
        var candidates = (data && data.candidates) || [];
        openModal(function (box) {
            box.appendChild(el("h3", "", t("modal.invite")));
            box.appendChild(el("p", "", t("modal.invite_text")));
            var body = el("div", "modal-body");
            var list = el("div", "pick");
            if (!candidates.length) {
                list.appendChild(el("div", "empty", t("modal.invite_none")));
            }
            candidates.forEach(function (name) {
                var row = el("div", "pick-row");
                row.appendChild(avatarNode(name, "", ""));
                row.appendChild(el("span", "", name));
                row.appendChild(button(t("modal.invite_call"), "btn btn-sm", function () {
                    lobby("invite", name);
                    closeModal();
                }));
                list.appendChild(row);
            });
            body.appendChild(list);
            box.appendChild(body);
            var actions = el("div", "modal-actions");
            actions.appendChild(button(t("modal.close"), "btn btn-quiet", closeModal));
            box.appendChild(actions);
        });
    }

    function confirmModal(title, text, confirmText, action) {
        openModal(function (box) {
            box.appendChild(el("h3", "", title));
            box.appendChild(el("p", "", text));
            var actions = el("div", "modal-actions");
            actions.appendChild(button(t("modal.cancel"), "btn btn-quiet", closeModal));
            actions.appendChild(button(confirmText, "btn btn-primary", function () {
                action();
                closeModal();
            }));
            box.appendChild(actions);
        });
    }

    // --- Тоасты -----------------------------------------------------------

    function toast(data) {
        var host = document.getElementById("toasts");
        var card = el("div", "toast");
        card.dataset.kind = data.kind || "info";
        card.appendChild(el("div", "toast-title", data.title || ""));
        if (data.text) { card.appendChild(el("div", "toast-text", data.text)); }

        // Таймер снимается вместе с карточкой: иначе он досчитает до конца и уведёт в
        // анимацию ухода уже удалённый узел, а следующий тоаст успеет встать на его место.
        var timer = 0;
        function dismiss() {
            if (timer) { window.clearTimeout(timer); timer = 0; }
            card.classList.add("out");
            window.setTimeout(function () { card.remove(); }, 240);
        }

        card.appendChild(iconButton("close", t("toast.close"), "toast-close", dismiss));
        host.appendChild(card);
        timer = window.setTimeout(dismiss, 5200);
        while (host.children.length > 4) { host.firstChild.remove(); }
    }

    // --- Экран: игра ------------------------------------------------------

    function renderMain(host) {
        var snapshot = state.snapshot;

        if (!snapshot) {
            host.appendChild(el("div", "empty", t("main.waiting")));
            return;
        }

        (snapshot.invites || []).forEach(function (invite) {
            var card = el("div", "invite");
            card.appendChild(avatarNode(invite.from, "", ""));
            var text = el("div", "");
            text.appendChild(el("div", "invite-who", t("main.invite_who", invite.from)));
            text.appendChild(el("div", "invite-what", t("main.invite_what", invite.lobby, invite.code)));
            card.appendChild(text);
            var actions = el("div", "invite-actions");
            actions.appendChild(button(t("main.decline"), "btn btn-sm btn-quiet", function () {
                lobby("decline", invite.code);
            }));
            actions.appendChild(button(t("main.accept"), "btn btn-sm btn-primary", function () {
                lobby("accept", invite.code);
            }));
            card.appendChild(actions);
            host.appendChild(card);
        });

        if (snapshot.phase === "queue") {
            var queue = snapshot.queue || { size: 1, needed: 3 };
            var box = el("div", "queue");
            box.appendChild(el("div", "arc"));
            var text = el("div", "");
            text.appendChild(el("div", "queue-title", t("main.queue_title", queue.size, queue.needed)));
            text.appendChild(el("div", "queue-sub", t("main.queue_sub")));
            box.appendChild(text);
            box.appendChild(button(t("main.queue_cancel"), "btn", function () { lobby("queue_leave"); }));
            host.appendChild(box);
            return;
        }

        var lede = el("p", "lede");
        lede.innerHTML = t("main.lede");
        host.appendChild(lede);

        var rooms = countRooms();
        var acts = el("div", "acts");
        acts.style.marginTop = "2.2rem";
        acts.appendChild(actRow("01", t("main.act_quick"), t("main.act_quick_desc"), "",
                function () { lobby("quick"); }));
        acts.appendChild(actRow("02", t("main.act_rooms"), t("main.act_rooms_desc"),
                rooms.total ? t("main.free", rooms.free) : "",
                function () { show("lobbies"); }));
        acts.appendChild(actRow("03", t("main.act_create"), t("main.act_create_desc"), "",
                function () { show("create"); }));
        host.appendChild(acts);
    }

    function actRow(number, name, description, meta, handler) {
        var row = el("button", "act");
        row.appendChild(el("div", "act-no", number));
        var body = el("div", "act-body");
        body.appendChild(el("div", "act-name", name));
        body.appendChild(el("div", "act-desc", description));
        row.appendChild(body);
        if (meta) { row.appendChild(el("div", "act-meta", meta)); }
        row.appendChild(icon("arrow", "act-go"));
        row.addEventListener("click", handler);
        return row;
    }

    // --- Экран: комнаты ---------------------------------------------------

    function renderLobbies(host) {
        var lobbies = (state.snapshot && state.snapshot.lobbies) || [];

        var filters = el("div", "filters");
        var seg = el("div", "seg");
        ["all", "free", "open"].forEach(function (id) {
            seg.appendChild(button(t("rooms." + id), state.filter === id ? "on" : "", function () {
                state.filter = id;
                render();
            }));
        });
        filters.appendChild(seg);

        var search = el("div", "search");
        search.appendChild(icon("search"));
        var input = el("input");
        input.id = "f-search";
        input.placeholder = t("rooms.search");
        input.value = state.search;
        input.addEventListener("input", function () {
            state.search = input.value;
            render();
        });
        search.appendChild(input);
        filters.appendChild(search);

        filters.appendChild(iconButton("refresh", t("rooms.refresh"), "btn icon-btn btn-quiet",
                function () { lobby("open"); }));
        var create = el("button", "btn btn-sm");
        create.appendChild(icon("plus"));
        create.appendChild(el("span", "", t("rooms.create")));
        create.addEventListener("click", function () { show("create"); });
        filters.appendChild(create);
        host.appendChild(filters);

        var needle = state.search.trim().toLowerCase();
        var visible = lobbies.filter(function (entry) {
            if (state.filter === "free" && !entry.joinable) { return false; }
            if (state.filter === "open" && entry.private) { return false; }
            if (!needle) { return true; }
            return (entry.name + " " + entry.host + " " + entry.code).toLowerCase().indexOf(needle) >= 0;
        });

        if (!visible.length) {
            var box = el("div", "rooms");
            box.appendChild(el("div", "empty", lobbies.length ? t("rooms.no_match") : t("rooms.empty")));
            host.appendChild(box);
            return;
        }

        var rooms = el("div", "rooms");
        visible.forEach(function (entry) { rooms.appendChild(roomRow(entry)); });
        host.appendChild(rooms);
    }

    function roomRow(entry) {
        var row = el("div", "room");
        row.appendChild(el("div", "room-code", entry.code));

        var body = el("div", "");
        var name = el("div", "room-name");
        name.appendChild(el("span", "", entry.name));
        if (entry.private) { name.appendChild(icon("lock", "room-lock")); }
        body.appendChild(name);
        body.appendChild(el("div", "room-sub",
                t("rooms.host", entry.host, difficultyName(entry.difficulty).toLowerCase())));
        row.appendChild(body);

        var slots = el("div", "slots");
        for (var i = 0; i < entry.max; i++) { slots.appendChild(el("i", i < entry.players ? "on" : "")); }
        row.appendChild(slots);

        row.appendChild(entry.state === "playing"
                ? tag("dot", t("rooms.playing"), "tag-live room-state")
                : tag(null, entry.players + " / " + entry.max, "room-state"));

        if (entry.joinable) {
            row.appendChild(button(t("rooms.enter"), "btn btn-sm", function () {
                if (entry.private) {
                    passwordModal(entry);
                } else {
                    lobby("join", JSON.stringify({ code: entry.code, password: "" }));
                }
            }));
        } else {
            row.appendChild(el("div", "tag",
                    entry.state === "playing" ? t("rooms.busy") : t("rooms.full")));
        }
        return row;
    }

    // --- Экран: создание --------------------------------------------------

    function renderCreate(host) {
        var draft = state.draft;
        var form = el("div", "form");

        var nameRow = el("div", "form-row");
        nameRow.appendChild(el("div", "label", t("create.name")));
        var nameField = el("div", "field");
        var nameInput = el("input");
        nameInput.id = "f-name";
        nameInput.placeholder = t("create.name_hint", selfName());
        nameInput.maxLength = 24;
        nameInput.value = draft.name;
        nameInput.addEventListener("input", function () { draft.name = nameInput.value; });
        nameField.appendChild(nameInput);
        nameRow.appendChild(nameField);
        form.appendChild(nameRow);

        var accessRow = el("div", "form-row");
        accessRow.appendChild(el("div", "label", t("create.access")));
        var access = el("div", "choice");
        access.appendChild(choiceCard(t("create.open"), t("create.open_desc"),
                !draft.private, function () { draft.private = false; render(); }));
        access.appendChild(choiceCard(t("create.private"), t("create.private_desc"),
                draft.private, function () { draft.private = true; render(); }));
        accessRow.appendChild(access);
        form.appendChild(accessRow);

        if (draft.private) {
            var passRow = el("div", "form-row");
            passRow.appendChild(el("div", "label", t("create.password")));
            var passField = el("div", "field");
            var passInput = el("input");
            passInput.id = "f-pass";
            // Пароль скрыт по умолчанию: комнату часто создают со зрителями за спиной.
            passInput.type = state.showPassword ? "text" : "password";
            passInput.placeholder = t("create.password_hint");
            passInput.maxLength = 32;
            passInput.value = draft.password;
            passInput.addEventListener("input", function () {

                if (submitButton) { submitButton.disabled = !draft.password; }
            });
            passField.appendChild(passInput);
            passField.appendChild(iconButton(state.showPassword ? "eye_off" : "eye",
                    t(state.showPassword ? "create.password_hide" : "create.password_show"), "peek",
                    function () {
                        state.showPassword = !state.showPassword;
                        render();
                    }));
            passRow.appendChild(passField);
            passRow.appendChild(el("div", "note", t("create.password_note")));
            form.appendChild(passRow);
        }

        var diffRow = el("div", "form-row");
        diffRow.appendChild(el("div", "label", t("create.difficulty")));
        var diff = el("div", "choice");
        DIFFICULTY_IDS.forEach(function (id) {
            diff.appendChild(choiceCard(difficultyName(id), t("diff." + id + ".desc"),
                    draft.difficulty === id, function () {
                        draft.difficulty = id;
                        render();
                    }));
        });
        diffRow.appendChild(diff);
        form.appendChild(diffRow);

        var submit = button(t("create.submit"), "btn btn-primary btn-lg btn-wide", function () {
            lobby("create", JSON.stringify({
                name: draft.name,
                private: draft.private,
                password: draft.password,
                difficulty: draft.difficulty
            }));
        });
        submit.id = "btn-create";
        submit.disabled = draft.private && !draft.password;

        host.appendChild(form);

    function choiceCard(name, description, active, handler) {
        var card = el("button", "choice-card" + (active ? " on" : ""));
        card.appendChild(el("div", "choice-name", name));
        card.appendChild(el("div", "choice-desc", description));

    // --- Экран: лобби -----------------------------------------------------

        host.appendChild(bar);

        var roles = el("div", "roles");

        var members = el("div", "members");

            text.appendChild(el("div", "member-name", member.name));
            var sub = el("div", "member-role");
            if (member.role) { sub.appendChild(roleDot(member.role)); }
            sub.appendChild(document.createTextNode(
                    (member.role ? roleName(member.role) : t("lobby.no_role"))

            node.appendChild(text);
            members.appendChild(node);
        });
        for (var free = (data.members || []).length; free < 3; free++) {
            var slot = el("div", "member empty-slot");
            slot.appendChild(el("div", "avatar avatar-stub avatar-lg", "·"));
            var stub = el("div", "");
            stub.appendChild(el("div", "member-name", t("lobby.slot_free")));
            stub.appendChild(el("div", "member-role", t("lobby.slot_wait")));
            slot.appendChild(stub);
            members.appendChild(slot);
        }
        host.appendChild(block(t("lobby.members"), members));

        var start = el("div", "start");
        if (data.state === "playing") {
            if (data.host) {
                start.appendChild(button(t("lobby.stop"), "btn btn-lg", function () {
                    confirmModal(t("lobby.stop_title"), t("lobby.stop_text"),
                            t("lobby.stop_confirm"), function () { lobby("stop"); });
                }));
            } else {
                start.appendChild(el("div", "start-hint", t("lobby.playing_hint")));
            }
        } else if (data.host) {
            // Подсказка идёт над кнопкой: у правого края последним стоит то, что жмут.
            if (!data.canStart && data.startHint) { start.appendChild(el("div", "start-hint", data.startHint)); }

            go.disabled = !data.canStart;
            start.appendChild(go);
        } else {
            start.appendChild(el("div", "start-hint", data.canStart
                    ? t("lobby.ready_hint")
                    : (data.startHint || t("lobby.wait_hint"))));
        }

        // Настройки забега и старт — один блок: до старта хост трогает только их двоих.
        if (data.host && data.state !== "playing") {
            var tune = el("div", "lobby-tune");
            var diff = el("div", "choice");
            DIFFICULTY_IDS.forEach(function (id) {

                        data.difficulty === id, function () { lobby("difficulty", id); }));
            });

            // Кулдаун эхо-пинга — правило команды, поэтому он тут, а не в настройках клиента.
            var echo = el("div", "lobby-echo");
            echo.appendChild(el("div", "setting-name", t("lobby.echo")));
            echo.appendChild(el("div", "setting-desc", t("lobby.echo_desc")));

                return t("settings.seconds", Math.round(value));

            echoSlider.firstChild.id = "f-echo";
            echo.appendChild(echoSlider);

            // Ротация — тоже правило команды, а не вкус: она решает, увидит ли каждый режим

            var rotate = el("div", "lobby-rotate");

            rotateText.appendChild(el("div", "setting-name", t("lobby.rotate")));

            side.appendChild(echo);
            side.appendChild(rotate);

    /**
     * Экран итогов забега. Открывает его мод пакетом, а не страница: забег может кончиться
     * с закрытым меню — например, когда его останавливает хост.
     *
     * Роль показывается парой «был → станет». Ротация иначе невидима: она молча меняет карту
     * ролей на сервере, и команда узнавала бы о ней, только открыв лобби и присмотревшись.
     */
    function renderSummary(host) {
        var data = state.summary;
        if (!data) {
            host.appendChild(el("div", "empty", t("lobby.none")));
            return;
        }
        var wrap = el("div", "sum");

        var win = !!data.reachedEnd;
        wrap.appendChild(el("div", "sum-verdict" + (win ? " win" : ""),
                win ? t("sum.end") : t("sum.title")));
        wrap.appendChild(el("div", "sum-sub", win ? t("sum.title") : t("sum.failed")));
        if (data.dragonKilled) {
            var dragon = el("div", "sum-dragon");
            dragon.appendChild(el("span", "", t("sum.dragon")));
            wrap.appendChild(dragon);
        }

        var stats = el("div", "sum-stats");
        stats.appendChild(statCard(t("sum.time"), clock(data.seconds || 0)));
        stats.appendChild(statCard(t("sum.deaths"), String(data.deaths || 0)));
        stats.appendChild(statCard(t("sum.difficulty"), difficultyName(data.difficulty)));
        var statsBlock = block(null, stats);
        statsBlock.style.marginTop = "2rem";
        wrap.appendChild(statsBlock);

        var roles = el("div", "sum-roles");
        (data.roles || []).forEach(function (entry) {
            var row = el("div", "sum-role");
            row.appendChild(avatarNode(entry.name, entry.uuid, ""));
            row.appendChild(el("div", "member-name", entry.name));
            var was = el("div", "sum-was");
            was.appendChild(roleDot(entry.role));
            was.appendChild(el("span", "", roleName(entry.role)));
            row.appendChild(was);
            if (data.rotated) {
                row.appendChild(el("div", "sum-arrow", "\u2192"));
                var will = el("div", "sum-will");
                will.appendChild(roleDot(entry.next));
                will.appendChild(el("span", "", roleName(entry.next)));
                row.appendChild(will);
            }
            roles.appendChild(row);
        });
        wrap.appendChild(block(data.rotated ? t("sum.next") : t("sum.roles"), roles));
        wrap.appendChild(el("div", "sum-note", data.rotated ? t("sum.rotated") : t("sum.kept")));

        var announce = data.announce;
        if (announce && announce.text) {
            wrap.appendChild(el("div", "sum-note sum-announce", announce.text));
        }

        var actions = el("div", "sum-actions");
        // Кнопка владельца сервера стоит слева от «В лобби»: уход с сервера — не то
        // действие, на которое нажимают не глядя.
        if (announce && announce.label) {
            actions.appendChild(button(announce.label, "btn btn-lg", function () {
                lobby("network_connect", "");
            }));
        }
        actions.appendChild(button(t("sum.back"), "btn btn-primary btn-lg", function () {
            show(state.snapshot && state.snapshot.lobby ? "lobby" : "main");
        }));
        wrap.appendChild(actions);
        host.appendChild(wrap);
    }

    function statCard(label, value) {
        var node = el("div", "sum-stat");
        node.appendChild(el("div", "label", label));
        node.appendChild(el("b", "", value));
        return node;
    }

    /** Время забега. Часы появляются только когда они есть — иначе «00:» съедает взгляд. */
    function clock(seconds) {
        var hours = Math.floor(seconds / 3600);
        var minutes = Math.floor(seconds % 3600 / 60);
        var rest = seconds % 60;
        var pad = function (value) { return value < 10 ? "0" + value : String(value); };
        return hours > 0
                ? hours + ":" + pad(minutes) + ":" + pad(rest)
                : minutes + ":" + pad(rest);
    }

    function roleCard(role, data) {
        var taken = !!role.occupant;
        var node = el("button", "role" + (taken ? "" : " free") + (role.mine ? " mine" : ""));
        node.dataset.role = role.id;
        node.appendChild(icon(ROLE_MARK[role.id] || "dot", "role-mark"));
        node.appendChild(el("div", "role-name", role.name));
        node.appendChild(el("div", "role-lack", t("role." + role.id + ".lack")));
        node.appendChild(el("div", "role-desc", t("role." + role.id + ".desc")));

        var foot = el("div", "role-foot");
        if (taken) {
            foot.appendChild(avatarNode(role.occupant, role.occupantUuid, ""));
            foot.appendChild(el("div", "role-occupant", role.occupant));
            if (role.mine && data.state !== "playing") {
                foot.appendChild(roleHint(t("role.release")));
            }
        } else {
            foot.appendChild(el("div", "role-free", t("role.free")));
            if (data.state !== "playing") { foot.appendChild(roleHint(t("role.take"))); }
        }
        node.appendChild(foot);

        if (data.state === "playing" || (taken && !role.mine)) {
            node.classList.add("locked");
            node.disabled = true;
        } else if (role.mine) {
            node.addEventListener("click", function () { lobby("role_clear"); });
        } else {
            node.addEventListener("click", function () { lobby("role", role.id); });
        }
        return node;
    }

    /* Значок ЛКМ рядом с подсказкой: карточка роли выглядит как текст, а не как кнопка,
       и без указания на мышь «занять» читается описанием, а не приглашением нажать. */
    function roleHint(text) {
        var node = el("div", "role-hint");
        node.appendChild(icon("mouse"));
        node.appendChild(el("span", "", text));
        return node;
    }
