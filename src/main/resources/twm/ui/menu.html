    /* Выбор из нескольких строковых значений. Тот же вид, что у переключателя: настройка,
       у которой больше двух состояний, всё равно остаётся одной строкой и одним рядом. */
    function choiceControl(path, current, options) {
        var control = el("div", "control");
        var seg = el("div", "seg");
        options.forEach(function (option) {
            seg.appendChild(button(option[1], current === option[0] ? "on" : "", function () {
                if (current === option[0]) { return; }
                setting(path, option[0]);
            }));
        });
        control.appendChild(seg);
        return control;
    }

    function settingRow(name, description, control) {
        var row = el("div", "setting");
        var text = el("div", "");
        text.appendChild(el("div", "setting-name", name));
        if (description) { text.appendChild(el("div", "setting-desc", description)); }
        row.appendChild(text);
        row.appendChild(control);
        return row;
    }

    function fillSlider(input) {
        var min = parseFloat(input.min);
        var max = parseFloat(input.max);
        input.style.setProperty("--fill", (parseFloat(input.value) - min) / (max - min) * 100 + "%");
    }

    function sliderControl(path, min, max, step, value, format) {
        return slider(min, max, step, value, format, function (next) { setting(path, next); });
    }

    /* Куда уедет значение, решает вызывающий: настройки клиента пишут в конфиг, лобби —
       шлёт действие на сервер. Сам ползунок об этом ничего не знает. */
    function slider(min, max, step, value, format, commit) {
        var wrap = el("div", "control");
        var input = el("input");
        input.type = "range";
        input.min = min;
        input.max = max;
        input.step = step;
        input.value = value;
        var readout = el("div", "readout", format(value));
        input.addEventListener("input", function () {
            readout.textContent = format(parseFloat(input.value));
            fillSlider(input);
        });
        // Отправляем по отпусканию, а не на каждый пиксель: иначе на каждое движение
        // мыши уходил бы запрос в мод и запись файла настроек.
        input.addEventListener("change", function () { commit(parseFloat(input.value)); });
        fillSlider(input);
        wrap.appendChild(input);
        wrap.appendChild(readout);
        return wrap;
    }

    function toggleControl(path, value) {
        var wrap = el("div", "control");
        var node = el("button", "toggle" + (value ? " on" : ""));
        node.addEventListener("click", function () {
            var next = !node.classList.contains("on");
            node.classList.toggle("on", next);
            setting(path, next);
        });
        wrap.appendChild(node);
        return wrap;
    }

    function percent(value) {
        return Math.round(value * 100) + "%";
    }

    function sameColor(left, right) {
        return String(left).toLowerCase() === String(right || "").toLowerCase();
    }

    // --- Экран: справка ---------------------------------------------------

    /* Справку открывают посреди забега ради одной конкретной вещи, и почти всегда — своей.
       Поэтому сверху стоит роль игрока целиком, а две чужие сжаты в таблицу связи: про
       соседа нужно знать ровно одно — доходит до него голос или нет. Три равные колонки,
       стоявшие тут раньше, заставляли каждый раз искать свою среди чужих, а сказать
       успевали по четыре обрубка на роль.

       Роль берётся та же, что в обучении: пока забег не начался, её нет — и тогда
       показываются все три карточки, потому что в лобби как раз выбирают. */
    var ROLE_IDS = ["head", "hands", "legs"];

    /* Строка — кто говорит, столбец — кто слышит. Таблица повторяет `VoiceRules` на сервере
       и обязана меняться вместе с ним: расхождение здесь стоит дороже любой опечатки,
       потому что игрок поверит справке и решит, что у него сломался микрофон. */
    var GUIDE_LINK = {
        head:  { head: "self",  hands: "none",  legs: "thought" },
        hands: { head: "voice", hands: "self",  legs: "none" },
        legs:  { head: "voice", hands: "voice", legs: "self" }
    };

    var GUIDE_KEYS = [
        { id: "lobby", who: "all" },
        { id: "guide", who: "all" },
        { id: "thoughts", who: "head" },
        { id: "free_look", who: "head_hands" },
        { id: "ping", who: "legs_hard" }
    ];

    function guideHero(id, mine) {
        var card = el("div", "guide-hero" + (mine ? " mine" : ""));
        card.dataset.role = id;

        var mark = el("div", "");
        mark.appendChild(icon(ROLE_MARK[id], "role-mark"));
        if (mine) { mark.appendChild(el("div", "guide-mine", t("guide.your_role"))); }
        mark.appendChild(el("h3", "", roleName(id)));
        mark.appendChild(el("div", "role-lack", t("role." + id + ".lack")));
        mark.appendChild(el("p", "guide-lede", t("guide." + id + ".lede")));
        card.appendChild(mark);

        ["can", "cant"].forEach(function (kind) {
            var column = el("div", "guide-facts" + (kind === "cant" ? " cant" : ""));
            column.appendChild(el("div", "label", t("guide." + kind)));
            var list = el("ul", "");
            for (var line = 1; line <= 4; line++) {
                list.appendChild(el("li", "", t("guide." + id + "." + kind + "." + line)));
            }
            column.appendChild(list);
            card.appendChild(column);
        });
        return card;
    }

    function guideMatrix() {
        var grid = el("div", "matrix");

        var corner = el("div", "m-corner");
        corner.appendChild(el("span", "", t("guide.link.hears") + " →"));
        corner.appendChild(el("span", "", t("guide.link.speaks") + " ↓"));
        grid.appendChild(corner);

        ROLE_IDS.forEach(function (id) {
            var cell = el("div", "m-col");
            cell.dataset.role = id;
            cell.appendChild(el("i", ""));
            cell.appendChild(el("span", "", roleName(id)));
            grid.appendChild(cell);
        });

        ROLE_IDS.forEach(function (from) {
            var head = el("div", "m-row");
            head.dataset.role = from;
            head.appendChild(el("i", ""));
            head.appendChild(el("span", "", roleName(from)));
            grid.appendChild(head);

            ROLE_IDS.forEach(function (to) {
                var kind = GUIDE_LINK[from][to];
                var cell = el("div", "m-" + kind + (kind === "self" ? " m-self" : ""));
                // Пустая клетка с алой чертой честнее слова «нет»: «сюда не доходит» обязано
                // читаться как дырка в сетке, а не как ещё одна строка текста. Диагональ
                // держится одной заливкой — «сам себя слышит» словами писать незачем.
                if (kind === "voice" || kind === "thought") {
                    cell.appendChild(el("span", "", t("guide.link." + kind)));
                }
                grid.appendChild(cell);
            });
        });
        return grid;
    }

    /* Словарь стоит внутри своих категорий, а не общим списком из тридцати плашек: в круге
       его так и выбирают — сначала категория, потом слово, — и справка обязана повторять
       этот путь, иначе она учит одному порядку, а игра требует другого. */
    function guideWheel() {
        var host = el("div", "");
        WHEEL_ROOT.items.forEach(function (entry) {
            var row = el("div", "dict-row");
            row.appendChild(el("div", "dict-key", entry.key));
            row.appendChild(el("div", "dict-name", t("group." + entry.id)));
            var chips = el("div", "dict");
            GROUPS[entry.id].items.forEach(function (item) {
                chips.appendChild(el("span", "", labelOf(item.id)));
            });
            row.appendChild(chips);
            host.appendChild(row);
        });

        var urgent = el("div", "dict-row urgent");
        urgent.appendChild(el("div", "dict-key", t("guide.wheel.center")));
        urgent.appendChild(el("div", "dict-name", t("guide.wheel.urgent")));
        var hot = el("div", "dict");
        [URGENT.top, URGENT.core, URGENT.bottom].forEach(function (entry) {
            hot.appendChild(el("span", "hot", labelOf(entry.id) + " · " + entry.key.toUpperCase()));
        });
        urgent.appendChild(hot);
        host.appendChild(urgent);
        return host;
    }

    function guideNotes(prefix, count) {
        var list = el("ul", "notes after");
        for (var line = 1; line <= count; line++) {
            list.appendChild(el("li", "", t(prefix + line)));
        }
        return list;
    }

    function renderGuide(host) {
        var role = tutorRole();
        var bound = {};
        ((state.settings && state.settings.keys) || []).forEach(function (entry) {
            bound[entry.id] = entry.key;
        });

        // Все три роли стоят всегда, своя — первой. Раньше справка показывала одну свою и
        // прятала остальные, но посреди забега чаще всего перечитывают как раз чужие: «почему
        // он меня не слышит» — это правило соседа, а не своё. Порядок при этом решает исходную
        // задачу — не искать свою роль среди трёх равных колонок.
        var roles = el("div", "");
        ROLE_IDS.slice().sort(function (a, b) {
            return (a === role ? 0 : 1) - (b === role ? 0 : 1);
        }).forEach(function (id) { roles.appendChild(guideHero(id, id === role)); });
        var rolesBlock = block(t("guide.roles"), roles);
        // Обучение показывается на старте забега, но забег начинается в спешке — а перечитать
        // правила своей роли чаще всего хочется уже посреди игры.
        rolesBlock.querySelector(".block-head").appendChild(
                button(t("guide.replay"), "btn btn-sm", function () { show("tutorial"); }));
        host.appendChild(rolesBlock);

        var link = el("div", "");
        link.appendChild(guideMatrix());
        link.appendChild(guideNotes("guide.link.note.", 4));
        host.appendChild(block(t("guide.link"), link));

        var wheel = el("div", "");
        wheel.appendChild(guideWheel());
        wheel.appendChild(guideNotes("guide.wheel.note.", 3));
        host.appendChild(block(t("guide.wheel"), wheel));

        var keys = el("div", "keys");
        GUIDE_KEYS.forEach(function (entry) {
            var row = el("div", "key-row");
            row.appendChild(el("kbd", "", bound["twm." + entry.id] || "—"));
            row.appendChild(el("span", "", t("guide.key." + entry.id)));
            row.appendChild(el("div", "key-who", t("guide.who." + entry.who)));
            keys.appendChild(row);
        });
        // Выброс предмета висит на ванильном бинде и в настройках мода не появляется:
        // переназначать чужую клавишу мод не должен, а сказать про неё обязан.
        var drop = el("div", "key-row");
        drop.appendChild(el("kbd", "", "Q"));
        drop.appendChild(el("span", "", t("guide.key.drop")));
        drop.appendChild(el("div", "key-who", t("guide.who.head")));
        keys.appendChild(drop);
        host.appendChild(block(t("guide.keys"), keys));
    }

    // --- Круг мыслей ------------------------------------------------------

    /* Раскладка задаётся смыслом, а не порядком словаря: «вправо» обязано быть справа.
       В прототипе элементы расставлялись по индексу перечисления — и путались местами.

       На кольце корня стоят только категории. Отдельные сигналы оттуда убраны: разнородные
       позиции вперемешку с группами читались как свалка, и выбирать в них приходилось
       перебором, а не движением руки. Разложить сигнал по смыслу можно только среди
       однородных ему — то есть внутри своей группы.

       Центр отдан срочным командам целиком. «СТОЙ!» занимает диск в самой середине: она
       нужна чаще всех и в тот момент, когда целиться некогда, а середина уже под курсором
       при открытии. «БЕЙ!» и «БЕГИ!» — половины кольца вокруг диска. Те же три висят на
       Z, X, C и срабатывают на любом уровне круга, включая подменю: лезть за срочной
       командой наверх — это тот самый случай, ради которого их вынесли на буквы.

       Число секторов в уровне обязано делить 90°, иначе сторона света попадёт на стык двух
       дуг и курсор, посланный точно вправо, выберет соседа. Направлениям поэтому дан шаг в
       45°: шесть направлений на восьми позициях, два места остаются пустыми. Пустое место
       честнее подставного — в него просто нельзя попасть.

       Клавиши раздаются по обходу уровня: 1…9, 0. */
    function signal(id, angle) {
        return { kind: "signal", id: id, angle: angle };
    }

    /** Уровень круга: шаг сетки и то, что на ней стоит. Пустые позиции сетки — это дырки. */
    function level(step, items) {
        for (var index = 0; index < items.length; index++) {
            items[index].key = SECTOR_KEYS[index];
        }
        return { step: step, items: items };
    }

    /** Равномерная раскладка: у элементов подменю своего направления нет, угол вычисляется. */
    function spread(ids) {
        var step = 360 / ids.length;
        return ids.map(function (id, index) { return signal(id, index * step); });
    }

    var SECTOR_KEYS = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"];

    var GROUPS = {
        direction: level(45, [
            signal("forward", 0),
            signal("up", 45),
            signal("right", 90),
            signal("backward", 180),
            signal("down", 225),
            signal("left", 270)
        ]),
        action: level(90, spread(["mine", "craft", "place", "take"])),
        number: level(36, spread(["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"])),
        state: level(120, spread(["danger", "health", "hunger"])),
        answer: level(120, spread(["yes", "no", "repeat"]))
    };

    /* Порядок категорий по ходу разговора: куда идти, что сделать, сколько, что со мной,
       ответ на вопрос. Направления сверху — их зовут чаще всех остальных вместе взятых. */
    var WHEEL_ROOT = level(72, [
        { kind: "group", id: "direction", angle: 0 },
        { kind: "group", id: "action", angle: 72 },
        { kind: "group", id: "number", angle: 144 },
        { kind: "group", id: "state", angle: 216 },
        { kind: "group", id: "answer", angle: 288 }
    ]);

    /* Срочные команды. Порядок буквально совпадает с местом: диск, верх кольца, низ кольца. */
    var URGENT = { core: { id: "stop", key: "x" },
                   top: { id: "attack", key: "z" },
                   bottom: { id: "run", key: "c" } };

    var WHEEL = {
        outer: 430,
        inner: 205,
        hub: 168,
        core: 96,
        labelRadius: 328,
        keyRadius: 246,
        moreRadius: 388,
        urgentLabel: 142,
        urgentKey: 112
    };

    function currentLevel() {
        if (!state.wheel.branch) { return WHEEL_ROOT; }
        return GROUPS[state.wheel.branch] || WHEEL_ROOT;
    }

    /** Границы сектора — половина шага в обе стороны. Дырка границ не имеет: в неё не попасть. */
    function sectorBounds(level, index) {
        var angle = level.items[index].angle;
        return { from: angle - level.step / 2, to: angle + level.step / 2 };
    }

    /** Индекс сектора, в который смотрит курсор, или −1, если это пустое место сетки. */
    function sectorAt(level, angle) {
        for (var index = 0; index < level.items.length; index++) {
            var delta = Math.abs(wrapAngle(angle - level.items[index].angle));
            if (delta <= level.step / 2) { return index; }
        }
        return -1;
    }

    /** Разница углов в диапазоне −180…180. */
    function wrapAngle(angle) {
        var value = (angle + 180) % 360;
        if (value < 0) { value += 360; }
        return value - 180;
    }

    /** Позиции сетки, на которых ничего не стоит: рисуются пунктиром, чтобы круг был кругом. */
    function emptySlots(level) {
        var slots = Math.round(360 / level.step);
        var holes = [];
        for (var slot = 0; slot < slots; slot++) {
            var angle = slot * level.step;
            var taken = level.items.some(function (item) { return Math.abs(wrapAngle(item.angle - angle)) < 0.5; });
            if (!taken) { holes.push(angle); }
        }
        return holes;
    }

    function labelOf(id) {
        for (var i = 0; i < state.dictionary.length; i++) {
            if (state.dictionary[i].id === id) { return state.dictionary[i].label; }
        }
        return id;
    }

    function itemLabel(entry) {
        return entry.kind === "group" ? t("group." + entry.id) : labelOf(entry.id);
    }

    function polar(angle, radius) {
        var radians = (angle - 90) * Math.PI / 180;
        return { x: 500 + Math.cos(radians) * radius, y: 500 + Math.sin(radians) * radius };
    }

    /** Кольцевой сектор: внешняя дуга по часовой, внутренняя обратно. */
    function sectorPath(from, to, inner, outer) {
        var a = polar(from, outer);
        var b = polar(to, outer);
        var c = polar(to, inner);
        var d = polar(from, inner);
        var large = (to - from) > 180 ? 1 : 0;
        return "M" + a.x + " " + a.y
                + "A" + outer + " " + outer + " 0 " + large + " 1 " + b.x + " " + b.y
                + "L" + c.x + " " + c.y
                + "A" + inner + " " + inner + " 0 " + large + " 0 " + d.x + " " + d.y + "Z";
    }

    /* Помощник ровно один на файл. Второе объявление с той же сигнатурой перекрыло бы это
       по hoisting молча: элементы создавались бы без атрибутов — без d, r и viewBox, то есть
       фигуры исчезают, а подписи уезжают в угол. Именно так круг мыслей пропал в 0.9.0. */
    function svgNode(tagName, attributes) {
        var node = document.createElementNS("http://www.w3.org/2000/svg", tagName);
        Object.keys(attributes || {}).forEach(function (name) {
            node.setAttribute(name, attributes[name]);
        });
        return node;
    }

    function svgText(x, y, className, text) {
        var node = svgNode("text", { x: x, y: y, class: className });
        node.textContent = text;
        return node;
    }

    function renderWheel() {
        var stage = document.getElementById("wheel-stage");
        stage.innerHTML = "";

        var level = currentLevel();
        var svg = svgNode("svg", { viewBox: "0 0 1000 1000" });

        // Первой ложится подложка середины — всё, что рисуется дальше, встаёт поверх неё.
        svg.appendChild(svgNode("circle", { cx: 500, cy: 500, r: WHEEL.inner, class: "wheel-well" }));

        emptySlots(level).forEach(function (angle) {
            svg.appendChild(svgNode("path", {
                d: sectorPath(angle - level.step / 2, angle + level.step / 2, WHEEL.inner, WHEEL.outer),
                class: "wheel-sector empty"
            }));
        });

        level.items.forEach(function (entry, index) {
            var bounds = sectorBounds(level, index);
            var active = state.wheel.hover === index;
            var group = entry.kind === "group";

            svg.appendChild(svgNode("path", {
                d: sectorPath(bounds.from, bounds.to, WHEEL.inner, WHEEL.outer),
                class: "wheel-sector" + (active ? " on" : "")
            }));

            var center = entry.angle;
            var labelAt = polar(center, WHEEL.labelRadius);
            var text = itemLabel(entry);
            svg.appendChild(svgText(labelAt.x, labelAt.y,
                    "wheel-label" + (active ? " on" : "") + (text.length > 7 ? " small" : ""), text));

            if (group) {
                // Три точки наружу от подписи: «внутри ещё несколько». Стрелка тут не годится —
                // в круге стрелка читается как направление, а направления здесь есть настоящие.
                for (var dot = -1; dot <= 1; dot++) {
                    var at = polar(center + dot * 2.6, WHEEL.moreRadius);
                    svg.appendChild(svgNode("circle", {
                        cx: at.x, cy: at.y, r: 3.4,
                        class: "wheel-more" + (active ? " on" : "")
                    }));
                }
            }

            var keyAt = polar(center, WHEEL.keyRadius);
            svg.appendChild(svgText(keyAt.x, keyAt.y, "wheel-key" + (active ? " on" : ""),
                    (entry.key || "").toUpperCase()));
        });

        svg.appendChild(svgNode("circle", { cx: 500, cy: 500, r: WHEEL.hub, class: "wheel-hub-line" }));

        if (state.wheel.branch) {
            renderHubBack(svg);
        } else {
            renderHubUrgent(svg);
        }

        stage.appendChild(svg);

        stage.appendChild(el("div", "wheel-title", state.wheel.branch
                ? t("group." + state.wheel.branch)
                : t("wheel.title")));

        var hint = el("div", "wheel-hint");
        hint.appendChild(hintItem(level.items.length >= 10 ? "1–9 0" : "1–" + level.items.length,
                t("wheel.hint_keys")));
        hint.appendChild(hintItem("Z X C", t("wheel.hint_urgent")));
        if (state.wheel.branch) {
            hint.appendChild(hintItem("Backspace", t("wheel.hint_back")));
        }
        hint.appendChild(hintItem("Esc", t("wheel.hint_close")));
        stage.appendChild(hint);
    }

    function hintItem(key, text) {
        var node = el("div", "");
        node.appendChild(el("b", "", key));
        node.appendChild(document.createTextNode(text));
        return node;
    }

    /* Середина круга: диск «СТОЙ!» и две половины кольца вокруг него под «БЕЙ!» и «БЕГИ!».
       Диск больше их обоих намеренно — в него попадают, не целясь. */
    function renderHubUrgent(svg) {
        [{ entry: URGENT.top, from: -90, to: 90, hub: 1, sign: -1 },
         { entry: URGENT.bottom, from: 90, to: 270, hub: 2, sign: 1 }].forEach(function (half) {
            var active = state.wheel.hub === half.hub;
            svg.appendChild(svgNode("path", {
                d: sectorPath(half.from, half.to, WHEEL.core, WHEEL.hub),
                class: "wheel-sector urgent" + (active ? " on" : "")
            }));
            svg.appendChild(svgText(500, 500 + half.sign * WHEEL.urgentLabel,
                    "wheel-label urgent" + (active ? " on" : ""), labelOf(half.entry.id)));
            svg.appendChild(svgText(500, 500 + half.sign * WHEEL.urgentKey,
                    "wheel-key" + (active ? " on" : ""), half.entry.key.toUpperCase()));
        });

        var active = state.wheel.hub === 0;
        svg.appendChild(svgNode("circle", {
            cx: 500, cy: 500, r: WHEEL.core,
            class: "wheel-sector urgent" + (active ? " on" : "")
        }));
        svg.appendChild(svgText(500, 490, "wheel-label urgent big" + (active ? " on" : ""),
                labelOf(URGENT.core.id)));
        svg.appendChild(svgText(500, 534, "wheel-key" + (active ? " on" : ""),
                URGENT.core.key.toUpperCase()));
    }

    /* В подменю середина целиком отдана возврату: срочные команды остаются на буквах, и
       делить середину на четверых значило бы промахиваться мимо каждой. */
    function renderHubBack(svg) {
        var active = state.wheel.hub >= 0;
        svg.appendChild(svgNode("circle", {
            cx: 500, cy: 500, r: WHEEL.hub,
            class: "wheel-sector" + (active ? " on" : "")
        }));
        svg.appendChild(svgText(500, 500, "wheel-label" + (active ? " on" : ""), t("wheel.back")));
    }

    /* Наведение считается по углу и радиусу от центра, а не попаданием в SVG-фигуру:
       угол честнее описывает намерение — курсор летит в сторону, а не в дугу, и у самого
       края сектора мышь не должна «проваливаться» между фигурами. */
    function wheelPointer(event) {
        var stage = document.getElementById("wheel-stage");
        var box = stage.getBoundingClientRect();
        var size = box.width;
        var x = (event.clientX - box.left) / size * 1000 - 500;
        var y = (event.clientY - box.top) / size * 1000 - 500;
        var radius = Math.sqrt(x * x + y * y);
        var angle = (Math.atan2(y, x) * 180 / Math.PI + 90 + 360) % 360;
        return { radius: radius, angle: angle };
    }

    function updateWheelHover(event) {
        var pointer = wheelPointer(event);
        var level = currentLevel();
        var sector = -1;
        var hub = -1;

        if (pointer.radius <= WHEEL.core) {
            hub = 0;
        } else if (pointer.radius <= WHEEL.hub) {
            // В подменю вся середина — возврат; в корне кольцо вокруг диска поделено пополам.
            hub = state.wheel.branch ? 0
                    : (pointer.angle < 90 || pointer.angle >= 270 ? 1 : 2);
        } else if (pointer.radius >= WHEEL.inner && pointer.radius <= WHEEL.outer + 30) {
            sector = sectorAt(level, pointer.angle);
        }

        if (sector === state.wheel.hover && hub === state.wheel.hub) { return; }
        // Тап звучит на каждую смену цели, включая уход в пустоту — иначе рука не чувствует,
        // где кончается активная зона.
        if (sector >= 0 || hub >= 0) { sfx("tap"); }
        state.wheel.hover = sector;
        state.wheel.hub = hub;
        renderWheel();
    }

    function chooseSector(index) {
        var level = currentLevel();
        if (index < 0 || index >= level.items.length) { return; }
        var entry = level.items[index];
        if (entry.kind === "group") {
            state.wheel.branch = entry.id;
            state.wheel.hover = -1;
            state.wheel.hub = -1;
            sfx("click");
            renderWheel();
            return;
        }
        sendThought(entry.id);
    }

    function chooseHub() {
        if (state.wheel.branch) {
            wheelBack();
            return;
        }
        var entry = state.wheel.hub === 1 ? URGENT.top
                : state.wheel.hub === 2 ? URGENT.bottom : URGENT.core;
        sendThought(entry.id);
    }

    function sendThought(id) {
        sfx("send");
        send({ cmd: "thought", signal: id });
    }

    function wheelBack() {
        if (!state.wheel.branch) { return; }
        state.wheel.branch = "";
        state.wheel.hover = -1;
        state.wheel.hub = -1;
        sfx("back");
        renderWheel();
    }

    function bindWheel() {
        var layer = document.getElementById("wheel");
        layer.addEventListener("mousemove", function (event) {
            if (state.screen !== "thoughts") { return; }
            updateWheelHover(event);
        });
        layer.addEventListener("mousedown", function (event) {
            if (state.screen !== "thoughts") { return; }
            if (event.button === 2) {
                wheelBack();
                return;
            }
            if (event.button !== 0) { return; }
            updateWheelHover(event);
            if (state.wheel.hub >= 0) {
                chooseHub();
            } else if (state.wheel.hover >= 0) {
                chooseSector(state.wheel.hover);
            }
        });
        layer.addEventListener("contextmenu", function (event) { event.preventDefault(); });
    }

    // --- Обучение ---------------------------------------------------------

    /* Показывается в начале каждого забега — правила ролей несимметричны, и человек,
       игравший вчера Головой, сегодня в Ногах глохнет и не понимает, почему.

       Пять шагов на роль, у каждого своя схема. Схема тут не иллюстрация: половина правил
       («сюда не доходит», «дальше пяти блоков ничего нет», «сначала категория, потом
       слово») словами занимает абзац и всё равно не запоминается, а картинкой — занимает
       секунду. Одна и та же схема на всех шагах не работает по обратной причине: к
       третьему шагу глаз перестаёт её читать и пролистывает вместе с текстом.

       Все схемы живут в одном вьюбоксе 120×120 и пользуются общими классами `fig-*`.
       Это не аккуратность ради аккуратности: разойдись у восьми картинок толщина линии
       или кегль подписи — пять шагов подряд выглядели бы нарисованными разными людьми. */

    var FIG_BOX = "0 0 120 120";

    function figSvg() {
        return svgNode("svg", { viewBox: FIG_BOX });
    }

    /** Значок роли в сетке 24×24, ужатый и поставленный центром в точку. */
    function figGlyph(role, x, y, size) {
        var scale = size / 24;
        var node = svgNode("g", {
            class: "tutor-glyph",
            "stroke-linecap": "round",
            "stroke-linejoin": "round",
            transform: "translate(" + (x - size / 2) + " " + (y - size / 2) + ") scale(" + scale + ")"
        });
        node.innerHTML = ICONS[ROLE_MARK[role]] || "";
        return node;
    }

    // --- Схема: одно тело на троих ----------------------------------------

    /* Первый шаг у всех трёх ролей отвечает на один и тот же вопрос: «что вообще моё?».
       Тело нарисовано так, как оно устроено в самой игре — стопкой коробок, — и разобрано
       на три части по ролям. Человечек из палок, стоявший тут раньше, говорил то же самое,
       но выглядел заглушкой; коробки заодно объясняют, почему двое других не могут сделать
       того, что делаете вы: у них другая часть тела, а не другие права. */
    var FIG_BODY_PARTS = {
        head:  [[16.5, 16, 21, 21]],
        hands: [[6.5, 37, 10, 31], [16.5, 37, 21, 31], [37.5, 37, 10, 31]],
        legs:  [[16.5, 68, 10, 31], [27.5, 68, 10, 31]]
    };

    var FIG_BODY_LEADS = {
        head:  { from: 37.5, y: 26 },
        hands: { from: 47.5, y: 52 },
        legs:  { from: 37.5, y: 84 }
    };

    function figBody(role) {
        var svg = figSvg();
        ROLE_IDS.forEach(function (id) {
            var mine = id === role;
            var lead = FIG_BODY_LEADS[id];
            var group = svgNode("g", { class: "fig-role" + (mine ? "" : " dim"), "data-role": id });

            FIG_BODY_PARTS[id].forEach(function (box) {
                group.appendChild(svgNode("rect", {
                    x: box[0], y: box[1], width: box[2], height: box[3],
                    fill: mine ? "currentColor" : "var(--ink-1)",
                    "fill-opacity": mine ? "0.14" : "1",
                    stroke: mine ? "currentColor" : "var(--rule-2)",
                    "stroke-width": mine ? 0.6 : 0.34
                }));
            });

            group.appendChild(svgNode("path", {
                d: "M" + lead.from + " " + lead.y + "H57",
                class: mine ? "fig-line" : "fig-rule"
            }));
            group.appendChild(svgText(60, lead.y - 2.6, "fig-name fig-left", roleName(id)));
            group.appendChild(svgText(60, lead.y + 2.8, "fig-sub fig-left", t("fig.body." + id)));
            svg.appendChild(group);
        });

        svg.appendChild(svgText(60, 110, "fig-sub", t("fig.body.title")));
        return svg;
    }

    // --- Схема: кольцо связи ----------------------------------------------

    /* Узлы стоят в вершинах равностороннего треугольника и не переставляются никогда:
       гаснут только связи. Иначе на каждом шаге глаз заново ищет, где что.

       Связи — прямые со сдвигом вбок, а не дуги. Дуга гнулась к середине треугольника,
       наезжала на соседнюю связь и утаскивала туда же свою подпись; перечёркнутая связь
       ложилась поверх горящей, и «не доходит» читалось как «сломалось везде». Сдвиг
       разводит встречную пару по разные стороны ребра сам собой, потому что нормаль
       считается от направления связи, а не задаётся руками. */
    var TUTOR_NODES = {
        head:  { x: 60,    y: 25, name: -20, lack: -14 },
        hands: { x: 25.36, y: 85, name: 17,  lack: 22.5 },
        legs:  { x: 94.64, y: 85, name: 17,  lack: 22.5 }
    };

    var TUTOR_NODE_R = 11;
    /* Сдвиг вбок задаёт и расстояние между встречной парой — оно вдвое больше сдвига.
       При 3.4 подписи двух встречных связей сходились почти вплотную и читались как одна. */
    var TUTOR_EDGE_OFFSET = 5;

    var TUTOR_EDGES = {
        "hands>head": { from: "hands", to: "head",  kind: "voice" },
        "legs>head":  { from: "legs",  to: "head",  kind: "voice" },
        "legs>hands": { from: "legs",  to: "hands", kind: "voice" },
        "head>legs":  { from: "head",  to: "legs",  kind: "thought" },
        // Двух связей ниже в игре не существует. На схеме они появляются только на том шаге,
        // который именно про их отсутствие, — постоянно висящий перечёркнутый путь читался бы
        // как «сломалось», а не как правило.
        "head>hands": { from: "head",  to: "hands", kind: "thought" },
        "hands>legs": { from: "hands", to: "legs",  kind: "voice" }
    };

    var TUTOR_IMPOSSIBLE = ["head>hands", "hands>legs"];

    function tutorEdge(key, mode) {
        var edge = TUTOR_EDGES[key];
        var a = TUTOR_NODES[edge.from];
        var b = TUTOR_NODES[edge.to];
        var dx = b.x - a.x;
        var dy = b.y - a.y;
        var length = Math.sqrt(dx * dx + dy * dy);
        var ux = dx / length;
        var uy = dy / length;
        // Нормаль к направлению связи. Развернуть связь — значит развернуть и нормаль,
        // поэтому встречная пара всегда оказывается по разные стороны ребра.
        var nx = -uy * TUTOR_EDGE_OFFSET;
        var ny = ux * TUTOR_EDGE_OFFSET;
        var gap = TUTOR_NODE_R + 2.5;
        var ax = a.x + ux * gap + nx;
        var ay = a.y + uy * gap + ny;
        var bx = b.x - ux * gap + nx;
        var by = b.y - uy * gap + ny;
        var mx = (ax + bx) / 2;
        var my = (ay + by) / 2;

        var group = svgNode("g", {
            class: "tutor-edge " + edge.kind + (mode ? " " + mode : ""),
            "data-from": edge.from
        });
        group.appendChild(svgNode("path", {
            d: "M" + ax.toFixed(2) + " " + ay.toFixed(2) + "L" + bx.toFixed(2) + " " + by.toFixed(2)
        }));

        // Остриё рисуется многоугольником, а не маркером: маркер в Chromium не наследует
        // цвет линии, и вся раскраска связей через currentColor рассыпалась бы.
        var head = 3.4;
        var wing = 1.5;
        group.appendChild(svgNode("polygon", {
            points: [
                bx.toFixed(2) + "," + by.toFixed(2),
                (bx - ux * head - uy * wing).toFixed(2) + "," + (by - uy * head + ux * wing).toFixed(2),
                (bx - ux * head + uy * wing).toFixed(2) + "," + (by - uy * head - ux * wing).toFixed(2)
            ].join(" ")
        }));

        // Подпись стоит на самой линии и закрывает её плашкой: вынести её вбок значит
        // столкнуть с подписью узла, а треугольник тесный.
        var caption = mode === "off"
                ? t("tutor.blocked")
                : t(edge.kind === "thought" ? "tutor.thought" : "tutor.voice");
        var width = caption.length * 1.75 + 2.4;
        group.appendChild(svgNode("rect", {
            x: (mx - width / 2).toFixed(2), y: (my - 2.1).toFixed(2),
            width: width.toFixed(2), height: "4.2"
        }));
        group.appendChild(svgText(mx, my, "", caption));

        if (mode === "off") {
            // Крест ставится на треть пути, а не на середину: середину занимает подпись,
            // и наложенный на неё крест зачёркивал слово вместо дороги.
            var cross = 2.2;
            var cx = ax + (bx - ax) * 0.3;
            var cy = ay + (by - ay) * 0.3;
            svgAppendAll(group, [
                svgNode("line", { class: "tutor-cross", x1: cx - cross, y1: cy - cross, x2: cx + cross, y2: cy + cross }),
                svgNode("line", { class: "tutor-cross", x1: cx - cross, y1: cy + cross, x2: cx + cross, y2: cy - cross })
            ]);
        }
        return group;
    }

    function svgAppendAll(host, nodes) {
        nodes.forEach(function (node) { host.appendChild(node); });
    }

    function tutorNode(id, self, active) {
        var point = TUTOR_NODES[id];
        var group = svgNode("g", {
            class: "tutor-node" + (self ? " self" : "") + (active ? " on" : ""),
            "data-role": id
        });
        group.appendChild(svgNode("circle", { cx: point.x, cy: point.y, r: TUTOR_NODE_R }));
        group.appendChild(figGlyph(id, point.x, point.y, 11));
        group.appendChild(svgText(point.x, point.y + point.name, "tutor-node-name fig-name", roleName(id)));
        group.appendChild(svgText(point.x, point.y + point.lack, "tutor-node-lack fig-sub", t("role." + id + ".lack")));
        return group;
    }

    function figLink(role, step) {
        var svg = figSvg();
        var on = step.on || [];
        var off = step.off || [];
        // Подсветка узлов выводится из связей, а не задаётся руками: список, который надо
        // держать в согласии со вторым списком, рано или поздно с ним расходится.
        var focus = {};
        focus[role] = true;
        on.concat(off).forEach(function (key) {
            focus[TUTOR_EDGES[key].from] = true;
            focus[TUTOR_EDGES[key].to] = true;
        });

        Object.keys(TUTOR_EDGES).forEach(function (key) {
            var mode = on.indexOf(key) >= 0 ? "on" : (off.indexOf(key) >= 0 ? "off" : "");
            if (!mode && TUTOR_IMPOSSIBLE.indexOf(key) >= 0) { return; }
            svg.appendChild(tutorEdge(key, mode));
        });
        // Узлы поверх связей: остриё, упёршееся в кружок, читается хуже, чем прикрытое им.
        ["head", "hands", "legs"].forEach(function (id) {
            svg.appendChild(tutorNode(id, id === role, !!focus[id]));
        });
        return svg;
    }

    // --- Схема: живой круг мыслей -----------------------------------------

    /* Единственная бесконечная анимация страницы кроме дуги подбора, и она заменяет собой
       абзац: «сначала категория, потом слово» показывается за один оборот. Шаг курсора и
       вспышка сектора синхронны не случайно — обе завязаны на один цикл в 10 секунд, по
       две на категорию, а `steps(5)` переставляет стрелку ровно на границе вспышки. */
    var FIG_WHEEL = { cx: 60, cy: 58, outer: 50, inner: 27, core: 12, label: 39, hand: 55 };

    /** Полярные координаты схем: угол считается от «вверх» по часовой, как в круге мыслей. */
    function figPolar(cx, cy, angle, radius) {
        var radians = (angle - 90) * Math.PI / 180;
        return { x: cx + Math.cos(radians) * radius, y: cy + Math.sin(radians) * radius };
    }

    function figWheelSector(from, to, inner, outer) {
        var a = figPolar(FIG_WHEEL.cx, FIG_WHEEL.cy, from, outer);
        var b = figPolar(FIG_WHEEL.cx, FIG_WHEEL.cy, to, outer);
        var c = figPolar(FIG_WHEEL.cx, FIG_WHEEL.cy, to, inner);
        var d = figPolar(FIG_WHEEL.cx, FIG_WHEEL.cy, from, inner);
        var large = (to - from) > 180 ? 1 : 0;
        return "M" + a.x.toFixed(2) + " " + a.y.toFixed(2)
                + "A" + outer + " " + outer + " 0 " + large + " 1 " + b.x.toFixed(2) + " " + b.y.toFixed(2)
                + "L" + c.x.toFixed(2) + " " + c.y.toFixed(2)
                + "A" + inner + " " + inner + " 0 " + large + " 0 " + d.x.toFixed(2) + " " + d.y.toFixed(2) + "Z";
    }

    function figWheel() {
        var svg = figSvg();
        WHEEL_ROOT.items.forEach(function (entry, index) {
            var from = entry.angle - 36;
            var to = entry.angle + 36;
            svg.appendChild(svgNode("path", {
                d: figWheelSector(from, to, FIG_WHEEL.inner, FIG_WHEEL.outer),
                class: "fig-wheel-sector"
            }));
            var lit = svgNode("path", {
                d: figWheelSector(from, to, FIG_WHEEL.inner, FIG_WHEEL.outer),
                class: "fig-wheel-lit"
            });
            lit.style.animationDelay = (index * 2) + "s";
            svg.appendChild(lit);

            var at = figPolar(FIG_WHEEL.cx, FIG_WHEEL.cy, entry.angle, FIG_WHEEL.label);
            svg.appendChild(svgText(at.x, at.y - 2, "fig-wheel-label", t("group." + entry.id)));
            svg.appendChild(svgText(at.x, at.y + 3.4, "fig-key", entry.key));
        });

        // Середина: диск «СТОЙ!» и две половины кольца вокруг него. Круг мыслей устроен
        // так же, и схема обязана совпадать с ним до расположения, а не только по смыслу.
        svg.appendChild(svgNode("path", {
            d: figWheelSector(-90, 90, FIG_WHEEL.core, FIG_WHEEL.inner), class: "fig-wheel-urgent"
        }));
        svg.appendChild(svgNode("path", {
            d: figWheelSector(90, 270, FIG_WHEEL.core, FIG_WHEEL.inner), class: "fig-wheel-urgent"
        }));
        svg.appendChild(svgNode("circle", {
            cx: FIG_WHEEL.cx, cy: FIG_WHEEL.cy, r: FIG_WHEEL.core, class: "fig-wheel-urgent"
        }));
        svg.appendChild(svgText(FIG_WHEEL.cx, FIG_WHEEL.cy - 19, "fig-wheel-urgent-label", labelOf(URGENT.top.id)));
        svg.appendChild(svgText(FIG_WHEEL.cx, FIG_WHEEL.cy - 1.2, "fig-wheel-urgent-label", labelOf(URGENT.core.id)));
        svg.appendChild(svgText(FIG_WHEEL.cx, FIG_WHEEL.cy + 3.6, "fig-key", URGENT.core.key.toUpperCase()));
        svg.appendChild(svgText(FIG_WHEEL.cx, FIG_WHEEL.cy + 19, "fig-wheel-urgent-label", labelOf(URGENT.bottom.id)));

        var hand = svgNode("g", { class: "fig-wheel-hand" });
        hand.appendChild(svgNode("polygon", {
            points: [
                FIG_WHEEL.cx + "," + (FIG_WHEEL.cy - FIG_WHEEL.hand + 4.5),
                (FIG_WHEEL.cx - 2.6) + "," + (FIG_WHEEL.cy - FIG_WHEEL.hand),
                (FIG_WHEEL.cx + 2.6) + "," + (FIG_WHEEL.cy - FIG_WHEEL.hand)
            ].join(" ")
        }));
        svg.appendChild(hand);

        svg.appendChild(svgText(60, 116, "fig-sub", t("fig.wheel.urgent")));
        return svg;
    }

    // --- Схема: обзор рук --------------------------------------------------

    /* Вид сверху, той же рамкой, что у эхолокации ног: у одних круг в пять блоков, у
       других расходящийся фронт, и сравнение читается только в одной проекции. */
    function figSight() {
        var svg = figSvg();
        var cx = 60;
        var cy = 56;
        var block = 6.4;

        // Потерянное рисуется первым и почти невидимо — это и есть его содержание.
        [[26, 20], [96, 26], [104, 74], [18, 88], [88, 100], [34, 14]].forEach(function (at) {
            svg.appendChild(svgNode("rect", {
                x: at[0] - 3, y: at[1] - 3, width: 6, height: 6, class: "fig-lost"
            }));
        });

        for (var ring = 1; ring <= 5; ring++) {
            svg.appendChild(svgNode("circle", {
                cx: cx, cy: cy, r: block * ring,
                class: ring === 5 ? "fig-seen" : "fig-faint"
            }));
        }

        svg.appendChild(svgNode("path", {
            d: "M" + cx + " " + (cy - 4.2) + "l3.4 6.4h-6.8Z", fill: "var(--hands)", stroke: "none"
        }));
        svg.appendChild(svgText(cx, cy + 6.6, "fig-sub", t("fig.sight.you")));
        // Выноска радиуса: без неё «5 блоков» читается как название круга, а не как его размер.
        svg.appendChild(svgNode("path", {
            d: "M" + (cx + 4) + " " + cy + "H" + (cx + block * 5)
                    + "M" + (cx + block * 5) + " " + (cy - 2.2) + "v4.4",
            class: "fig-rule"
        }));
        svg.appendChild(svgText(cx + block * 2.7, cy - 3.4, "fig-label", t("fig.sight.seen")));
        svg.appendChild(svgText(cx, 112, "fig-sub", t("fig.sight.lost")));
        return svg;
    }

    // --- Схема: эхолокация -------------------------------------------------

    function figEcho(role, step) {
        var svg = figSvg();
        var cx = 60;
        var cy = 56;
        var hard = state.difficulty === "hard";
        var waves = hard ? [17] : [15, 28, 41];

        // Контуры проявляются там, куда дошёл фронт, и гаснут по возрасту: ближние ярче,
        // дальние на грани видимости. Это ровно то, что видят ноги, и ровно то, чего они
        // не видят, — второе на схеме важнее.
        var marks = [[0, 15], [52, 15], [128, 15], [205, 15], [286, 15],
                     [24, 28], [96, 28], [163, 28], [242, 28], [320, 28],
                     [40, 41], [112, 41], [190, 41], [268, 41], [340, 41]];
        marks.forEach(function (mark) {
            var alive = waves.some(function (r) { return Math.abs(mark[1] - r) < 3; });
            var radians = (mark[0] - 90) * Math.PI / 180;
            var x = cx + Math.cos(radians) * mark[1];
            var y = cy + Math.sin(radians) * mark[1];
            var node = svgNode("rect", {
                x: (x - 2.6).toFixed(2), y: (y - 2.6).toFixed(2), width: 5.2, height: 5.2,
                class: alive ? "fig-echo" : "fig-lost"
            });
            if (alive) { node.setAttribute("opacity", String(1 - mark[1] / 70)); }
            svg.appendChild(node);
        });

        waves.forEach(function (radius, index) {
            var wave = svgNode("circle", { cx: cx, cy: cy, r: radius, class: "fig-wave" });
            wave.setAttribute("opacity", String(0.75 - index * 0.22));
            svg.appendChild(wave);
        });

        if (hard) {
            svg.appendChild(svgNode("circle", {
                cx: cx, cy: cy, r: 46, class: "fig-wave",
                "stroke-dasharray": "2 3", opacity: "0.4"
            }));
            svg.appendChild(svgText(cx, cy - 50, "fig-sub", t("fig.echo.ping")));
        }

        svg.appendChild(svgNode("circle", { cx: cx, cy: cy, r: 2, fill: "var(--legs)", stroke: "none" }));
        svg.appendChild(svgText(cx, 112, "fig-label", t(hard ? "fig.echo.hard" : "fig.echo.easy")));
        return svg;
    }

    // --- Схема: кольцо звуков ----------------------------------------------

    function figRadar() {
        var svg = figSvg();
        var cx = 60;
        var cy = 56;
        var ring = 30;
        var hard = state.difficulty === "hard";

        // Рамка экрана — единственная опора композиции: без неё прицел с парой дуг висит
        // в пустоте, и непонятно, что это вообще вид от первого лица.
        svg.appendChild(svgNode("rect", { x: 8, y: 10, width: 104, height: 92, rx: 0.6, class: "fig-faint" }));
        svg.appendChild(svgNode("path", {
            d: "M" + (cx - 5) + " " + cy + "h10M" + cx + " " + (cy - 5) + "v10", class: "fig-rule"
        }));
        svg.appendChild(svgText(cx, cy + 10, "fig-sub", t("fig.radar.aim")));
        // Самого кольца в игре не видно — рисуются только дуги. На схеме оно нужно
        // пунктиром, иначе непонятно, что дуги стоят на одной окружности.
        svg.appendChild(svgNode("circle", {
            cx: cx, cy: cy, r: ring, class: "fig-faint", "stroke-dasharray": "1.2 3"
        }));

        if (hard) {
            svg.appendChild(svgText(cx, 110, "fig-label", t("fig.radar.hard")));
            return svg;
        }

        // Дуга, а не метка в мире: у рук туман в пять блоков, и метка в проекции источника
        // почти всегда оказалась бы за его краем. Сторона — пеленг, толщина — дальность.
        [{ at: -52, span: 30, width: 2.6, key: "fig.radar.near" },
         { at: 148, span: 22, width: 1, key: "fig.radar.far" }].forEach(function (arc) {
            var from = figPolar(cx, cy, arc.at - arc.span / 2, ring);
            var to = figPolar(cx, cy, arc.at + arc.span / 2, ring);
            svg.appendChild(svgNode("path", {
                d: "M" + from.x.toFixed(2) + " " + from.y.toFixed(2)
                        + "A" + ring + " " + ring + " 0 0 1 " + to.x.toFixed(2) + " " + to.y.toFixed(2),
                class: "fig-arc", "stroke-width": arc.width
            }));
            // Подпись выносится по тому же лучу, что и дуга: разойдись они по сторонам —
            // и схема начнёт утверждать обратное тому, что говорит.
            var label = figPolar(cx, cy, arc.at, ring + 11);
            svg.appendChild(svgText(label.x, label.y, "fig-sub", t(arc.key)));
        });
        return svg;
    }

    // --- Схема: карточка мысли ---------------------------------------------

    /* Повторяет HUD один в один — плашка, значок, кегль, полоска жизни, цвет группы.
       Ноги увидят её через минуту в игре и обязаны узнать, а не разгадывать заново. */
    function figCard() {
        var svg = figSvg();

        svg.appendChild(svgText(60, 16, "fig-sub", t("fig.card.old")));
        svg.appendChild(svgNode("rect", { x: 34, y: 22, width: 52, height: 12, rx: 0.6, class: "fig-card-old" }));
        var oldGlyph = svgNode("g", {
            class: "tutor-glyph", stroke: "var(--paper-3)", "stroke-linecap": "round", "stroke-linejoin": "round",
            transform: "translate(41 25.2) scale(0.25)"
        });
        oldGlyph.innerHTML = '<path d="M12 20V4.6M5.6 11 12 4.6 18.4 11"/>';
        svg.appendChild(oldGlyph);
        svg.appendChild(svgText(64, 28.2, "fig-card-old-label", labelOf("forward")));
        svg.appendChild(svgNode("rect", { x: 34, y: 33.2, width: 18, height: 0.9, fill: "rgba(237, 231, 220, 0.22)" }));

        svg.appendChild(svgText(60, 52, "fig-sub", t("fig.card.now")));
        svg.appendChild(svgNode("rect", { x: 12, y: 58, width: 96, height: 26, rx: 0.6, class: "fig-card urgent" }));
        var glyph = svgNode("g", {
            class: "tutor-glyph", stroke: "var(--seal-2)", "stroke-linecap": "round", "stroke-linejoin": "round",
            transform: "translate(31 64.5) scale(0.54)"
        });
        glyph.innerHTML = ICONS.hand;
        svg.appendChild(glyph);
        svg.appendChild(svgText(68, 71.4, "fig-card-label urgent", labelOf(URGENT.core.id)));
        svg.appendChild(svgNode("rect", { x: 12, y: 82.4, width: 56, height: 1.6, class: "fig-card-life urgent" }));

        svg.appendChild(svgNode("path", { d: "M40 91v7h22", class: "fig-rule" }));
        svg.appendChild(svgText(65, 98, "fig-sub fig-left", t("fig.card.life")));
        return svg;
    }

    // --- Схема: что видно кому ---------------------------------------------

    /* Три экрана в столбик. Правило «полоски у одного, хотбар у другого, у третьего
       ничего» на словах звучит как случайность, а рядом — как одно тело, разобранное на
       троих. Экраны ландшафтные: портретный прямоугольник игрок за экран не примет. */
    var FIG_HUD_ROWS = [
        { id: "head", y: 12 },
        { id: "hands", y: 46 },
        { id: "legs", y: 80 }
    ];

    function figHud(role) {
        var svg = figSvg();
        FIG_HUD_ROWS.forEach(function (row) {
            var mine = row.id === role;
            var group = svgNode("g", { class: "fig-role" + (mine ? "" : " dim"), "data-role": row.id });
            var top = row.y;
            var mid = 34;

            group.appendChild(svgNode("rect", {
                x: 8, y: top, width: 52, height: 26, rx: 0.6,
                class: mine ? "fig-plate" : "fig-ink",
                stroke: mine ? "currentColor" : "var(--rule-2)",
                "stroke-width": mine ? 0.6 : 0.34
            }));

            if (row.id === "head") {
                // Полоски состояния прижаты к низу экрана — там их и рисует ванильный HUD.
                [["var(--seal)", top + 14], ["var(--head)", top + 19]].forEach(function (bar) {
                    for (var i = 0; i < 6; i++) {
                        group.appendChild(svgNode("rect", {
                            x: mid - 12.5 + i * 4.4, y: bar[1], width: 3, height: 3,
                            fill: bar[0], stroke: "none", opacity: mine ? "0.85" : "0.35"
                        }));
                    }
                });
            } else if (row.id === "hands") {
                for (var slot = 0; slot < 9; slot++) {
                    group.appendChild(svgNode("rect", {
                        x: mid - 14.4 + slot * 3.2, y: top + 17, width: 2.6, height: 2.6, class: "fig-rule"
                    }));
                }
            } else {
                // У ног нет ни одной полоски: экран занят контурами, и только ими.
                [[14, 5], [30, 9], [21, 16], [42, 13], [11, 19]].forEach(function (at) {
                    group.appendChild(svgNode("rect", {
                        x: 8 + at[0], y: top + at[1], width: 4, height: 4, class: "fig-echo",
                        opacity: mine ? "0.5" : "0.22"
                    }));
                });
            }

            group.appendChild(svgText(66, top + 10.4, "fig-name fig-left", roleName(row.id)));
            group.appendChild(svgText(66, top + 16.4, "fig-sub fig-left", t("fig.hud." + row.id)));
            svg.appendChild(group);
        });
        return svg;
    }

    var FIGURES = {
        body: figBody,
        link: figLink,
        wheel: figWheel,
        sight: figSight,
        echo: figEcho,
        radar: figRadar,
        card: figCard,
        hud: figHud
    };

    /* Пять шагов на роль. Порядок один и тот же у всех троих и повторяет порядок вопросов,
       которые человек задаёт себе сам: что я такое → чего я лишён → чем я это возмещаю →
       как я связан с остальными → что у нас общее. Роль меняется, вопросы нет. */
    var TUTOR_STEPS = {
        head: [
            { fig: "body" },
            { fig: "link", on: ["head>legs"], off: ["head>hands"] },
            { fig: "wheel" },
            { fig: "link", on: ["head>legs", "legs>hands", "hands>head"] },
            { fig: "hud" }
        ],
        hands: [
            { fig: "body" },
            { fig: "sight" },
            { fig: "link", on: ["legs>hands", "hands>head"], off: ["hands>legs"] },
            { fig: "radar", diff: true },
            { fig: "hud" }
        ],
        legs: [
            { fig: "body" },
            { fig: "echo", diff: true },
            { fig: "link", on: ["legs>hands", "legs>head"], off: ["hands>legs"] },
            { fig: "card" },
            { fig: "link", on: ["head>legs", "legs>hands", "hands>head"] }
        ]
    };

    function tutorRole() {
        return state.role || myRole() || "";
    }

    /** Клавиши в тексте — настоящие бинды игрока, а не то, что было в стандартных настройках. */
    function tutorPhrase(key) {
        var bound = {};
        ((state.settings && state.settings.keys) || []).forEach(function (entry) {
            bound[entry.id] = entry.key;
        });
        return t(key).replace(/\{([a-z_]+)\}/g, function (all, name) {
            return "<b>" + (bound["twm." + name] || "—") + "</b>";
        });
    }

    function tutorGo(delta) {
        var role = tutorRole();
        var steps = TUTOR_STEPS[role];
        if (!steps) { return; }
        var next = state.tutor.step + delta;
        if (next < 0) { return; }
        if (next >= steps.length) {
            send({ cmd: "close" });
            return;
        }
        state.tutor.step = next;
        if (next > state.tutor.seen) { state.tutor.seen = next; }
        sfx("click");
        render();
    }

    function renderTutorial() {
        var host = document.getElementById("tutor");
        host.innerHTML = "";
        var role = tutorRole();
        var steps = TUTOR_STEPS[role];

        var top = el("div", "tutor-top");
        top.appendChild(el("div", "tutor-eyebrow", t("tutor.role")));
        if (role) {
            var title = el("div", "tutor-role");
            title.appendChild(roleDot(role));
            title.appendChild(el("span", "", roleName(role)));
            title.appendChild(el("span", "role-lack", t("role." + role + ".lack")));
            top.appendChild(title);
        }
        // Пропуск стоит на месте с первого кадра и не уезжает между шагами: человеку, который
        // это уже знает, не должно приходиться искать выход.
        top.appendChild(button(t("tutor.skip"), "btn btn-sm btn-quiet",
                function () { send({ cmd: "close" }); }));
        host.appendChild(top);

        if (!steps) {
            // Роль приходит отдельным пакетом. Обычно раньше снимка лобби, но полагаться на
            // порядок двух пакетов нельзя — экран просто дождётся её и перерисуется сам.
            var wait = el("div", "tutor-body");
            wait.appendChild(el("div", "tutor-desc", t("tutor.wait")));
            host.appendChild(wait);
            return;
        }
        if (state.tutor.step >= steps.length) { state.tutor.step = steps.length - 1; }
        var index = state.tutor.step;
        var step = steps[index];
        var base = "tutor." + role + "." + (index + 1);

        var body = el("div", "tutor-body");
        var stage = el("div", "tutor-stage");
        stage.appendChild(FIGURES[step.fig](role, step));
        body.appendChild(stage);

        var text = el("div", "tutor-text");
        text.appendChild(el("div", "tutor-count", t("tutor.count", index + 1, steps.length)));
        text.appendChild(el("h2", "tutor-title", t(base + ".t")));
        var desc = el("div", "tutor-desc");
        desc.innerHTML = tutorPhrase(base + ".d" + (step.diff ? "." + state.difficulty : ""));
        text.appendChild(desc);
        body.appendChild(text);
        host.appendChild(body);

        var foot = el("div", "tutor-foot");
        var dots = el("div", "tutor-dots");
        steps.forEach(function (ignored, position) {
            var dot = el("i", position === index ? "on" : (position <= state.tutor.seen ? "seen" : ""));
            dot.addEventListener("click", function () {
                state.tutor.step = position;
                render();
            });
            dots.appendChild(dot);
        });
        foot.appendChild(dots);

        var nav = el("div", "tutor-nav");
        if (index > 0) {
            nav.appendChild(button(t("tutor.back"), "btn", function () { tutorGo(-1); }));
        }
        nav.appendChild(button(index === steps.length - 1 ? t("tutor.done") : t("tutor.next"),
                "btn btn-primary btn-wide", function () { tutorGo(1); }));
        foot.appendChild(nav);
        host.appendChild(foot);
    }

    // --- Общий рендер -----------------------------------------------------

    var RENDERERS = {
        main: renderMain,
        lobbies: renderLobbies,
        create: renderCreate,
        lobby: renderLobby,
        settings: renderSettings,
        guide: renderGuide,
        summary: renderSummary
    };

    /* Снимок сервера приходит и во время набора текста: если просто пересобрать экран,
       игрок теряет фокус и каретку прямо посреди слова. Поэтому активное поле
       запоминается по id и восстанавливается вместе с положением каретки. */
    function render() {
        var active = document.activeElement;
        var focusId = active && active.tagName === "INPUT" ? active.id : "";
        var caret = focusId ? active.selectionStart : 0;

        document.body.dataset.screen = state.screen;

        if (state.screen === "thoughts") {
            renderWheel();
            return;
        }

        if (state.screen === "tutorial") {
            renderTutorial();
            return;
        }

        renderNav();
        renderHead();
        renderCorner();
        renderLang();

        var screens = document.querySelectorAll(".screen");
        for (var i = 0; i < screens.length; i++) {
            var node = screens[i];
            var on = node.dataset.screen === state.screen;
            node.classList.toggle("active", on);
            if (!on) {
                node.innerHTML = "";
                continue;
            }
            node.innerHTML = "";
            (RENDERERS[node.dataset.screen] || renderMain)(node);
        }

        if (focusId) {
            var restored = document.getElementById(focusId);
            if (restored) {
                restored.focus();
                try { restored.setSelectionRange(caret, caret); } catch (ignored) { /* type=range */ }
            }
        }
    }

    function renderCorner() {
        var snapshot = state.snapshot;
        var name = selfName();
        document.getElementById("me-name").textContent = snapshot ? name : t("rail.dash");
        document.getElementById("credit").textContent = "Created by Arcanix Team"
                + (state.version ? " | ver. " + state.version : "");

        var sub = document.getElementById("me-sub");
        sub.innerHTML = "";
        var role = myRole();
        var text = t("rail.none");
        if (snapshot) {
            if (snapshot.phase === "queue") {
                text = t("rail.queue");
            } else if (snapshot.lobby) {
                text = snapshot.lobby.state === "playing"
                        ? (role ? roleName(role) : t("rail.playing"))
                        : snapshot.lobby.name;
            }
        }
        if (role) { sub.appendChild(roleDot(role)); }
        sub.appendChild(document.createTextNode(text));

        var image = document.getElementById("me-avatar");
        var uuid = snapshot && snapshot.self ? snapshot.self.uuid : "";
        var source = state.avatars[uuid] || state.avatars[name];
        if (source) {
            image.src = source;
            image.style.visibility = "visible";
        } else {
            image.style.visibility = "hidden";
            if (snapshot && !state.asked[uuid || name]) {
                state.asked[uuid || name] = true;
                send({ cmd: "avatar", uuid: uuid || "", name: name });
            }
        }
    }

    // --- Прокрутка --------------------------------------------------------

    /* CEF отдаёт колесо крупными дискретными шагами, и Chromium применяет их мгновенно:
       список не едет, а прыгает. Прокрутку берём на себя — колесо двигает только цель,
       а положение догоняет её по кадрам. Анимация не бесконечная: она живёт ровно столько,
       сколько едет список, поэтому правило «одна бесконечная анимация на страницу» цело. */
    var scrollNode = null;
    var scrollGoal = 0;
    var scrollFrame = 0;

    function scrollableFrom(node) {
        while (node && node !== document.body) {
            if (node.scrollHeight - node.clientHeight > 1) {
                var overflow = window.getComputedStyle(node).overflowY;
                if (overflow === "auto" || overflow === "scroll") { return node; }
            }
            node = node.parentElement;
        }
        return null;
    }

    function stepScroll() {
        scrollFrame = 0;
        if (!scrollNode) { return; }
        var limit = scrollNode.scrollHeight - scrollNode.clientHeight;
        if (scrollGoal > limit) { scrollGoal = limit; }
        var delta = scrollGoal - scrollNode.scrollTop;
        if (Math.abs(delta) < 0.6) {
            scrollNode.scrollTop = scrollGoal;
            scrollNode = null;
            return;
        }
        scrollNode.scrollTop += delta * 0.2;
        scrollFrame = requestAnimationFrame(stepScroll);
    }

    document.addEventListener("wheel", function (event) {
        var node = scrollableFrom(event.target);
        if (!node) { return; }
        event.preventDefault();
        if (node !== scrollNode) {
            scrollNode = node;
            scrollGoal = node.scrollTop;
        }
        // Шаг считается от высоты области, а не от deltaY: величина delta у CEF своя и
        // от «щелчка» колеса не зависит, а вот доля экрана за щелчок ощущается одинаково.
        scrollGoal += (event.deltaY > 0 ? 1 : -1) * node.clientHeight * 0.2;
        var limit = node.scrollHeight - node.clientHeight;
        if (scrollGoal < 0) { scrollGoal = 0; }
        if (scrollGoal > limit) { scrollGoal = limit; }
        if (!scrollFrame) { scrollFrame = requestAnimationFrame(stepScroll); }
    }, { passive: false });

    // --- Клавиатура и звук нажатий ----------------------------------------

    document.addEventListener("keydown", function (event) {
        if (state.capture) { return; }

        if (state.screen === "tutorial") {
            var forward = event.key === "ArrowRight" || event.key === "Enter" || event.key === " ";
            var backward = event.key === "ArrowLeft" || event.key === "Backspace";
            if (forward) { tutorGo(1); }
            if (backward) { tutorGo(-1); }
            return;
        }

        if (state.screen !== "thoughts") { return; }

        var key = event.key.toLowerCase();
        if (key === "backspace") {
            wheelBack();
            return;
        }
        // Срочные команды отвечают на любом уровне круга — ради этого их и вынесли на буквы.
        var urgent = [URGENT.core, URGENT.top, URGENT.bottom];
        for (var u = 0; u < urgent.length; u++) {
            if (urgent[u].key === key) {
                sendThought(urgent[u].id);
                return;
            }
        }
        var items = currentLevel().items;
        for (var index = 0; index < items.length; index++) {
            if (items[index].key === key) {
                chooseSector(index);
                return;
            }
        }
    });

    /* Звук нажатия вешается один раз на весь документ, а не на каждую кнопку: кнопок в
       интерфейсе десятки, и добавить звук забыли бы ровно в той, что появится завтра.
       Круг мыслей звучит сам — там нет кнопок, а есть сектора. */
    var hovered = null;

    document.addEventListener("mouseover", function (event) {
        var target = event.target.closest ? event.target.closest("button") : null;
        if (target === hovered) { return; }
        hovered = target;
        if (target && !target.disabled) { sfx("tap"); }
    });

    document.addEventListener("mousedown", function (event) {
        var target = event.target.closest ? event.target.closest("button") : null;
        if (target && !target.disabled) { sfx("click"); }
    }, true);

    // --- Приём данных из мода ---------------------------------------------

    window.twm = {
        onState: function (data) {
            var hadLobby = !!(state.snapshot && state.snapshot.lobby);
            var wasPlaying = !!(state.snapshot && state.snapshot.lobby
                    && state.snapshot.lobby.state === "playing");
            var nowPlaying = !!(data.lobby && data.lobby.state === "playing");
            state.snapshot = data;
            // Экран следует за состоянием: вошёл в лобби — показываем лобби, вышел —
            // возвращаемся на главный. Иначе игрок остаётся на списке и не понимает, что попал.
            if (!hadLobby && data.lobby && (state.screen === "main" || state.screen === "lobbies"
                    || state.screen === "create")) {
                state.screen = "lobby";
            } else if (hadLobby && !data.lobby && state.screen === "lobby") {
                state.screen = "main";
            }
            render();
            if (data.notice) { toast({ kind: "info", title: data.notice, text: "" }); }
            // Забег начался — вместо меню показывается обучение своей роли. Экран открывает
            // и мод (меню могло быть закрыто), и страница: два пути сходятся на одном экране,
            // а порядок «кто успел первым» перестаёт что-либо решать.
            if (!wasPlaying && nowPlaying) { show("tutorial"); }
        },
        onScreen: function (name) { show(name); },
        onSummary: function (data) {
            state.summary = data;
            if (state.screen === "summary") { render(); }
        },
        onMeta: function (data) {
            state.version = (data && data.version) || "";
            renderCorner();
        },
        onRole: function (data) {
            state.role = data.role;
            state.difficulty = data.difficulty;
            render();
        },
        onDictionary: function (items) {
            state.dictionary = items;
            render();
        },
        onSettings: function (data) {
            state.settings = data;
            if (data.ui && data.ui.language) { state.langChoice = data.ui.language; }
            if (state.screen === "settings" || state.screen === "guide") { render(); }
            renderLang();
        },
        onLang: function (data) {
            state.lang = data.code || "ru";
            state.langChoice = data.choice || "auto";
            if (data.options && data.options.length) { state.langOptions = data.options; }
            document.documentElement.setAttribute("lang", state.lang);
            render();
        },
        onAvatars: function (map) {
            Object.keys(map).forEach(function (key) { state.avatars[key] = map[key]; });
            render();
        },
        onToast: function (data) { toast(data); },
        onCapture: function (id) {
            state.capture = id || "";
            if (state.screen === "settings") { render(); }
        }
    };

    bindWheel();
    render();
})();
</script>
</body>
</html>
