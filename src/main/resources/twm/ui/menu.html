<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Three Wise Monkeys</title>
<style>
/* =====================================================================
   «Тушь и печать»

   Тёплый уголь, бумажный текст, одна вермильоновая печать на акцент.
   Правила, от которых зависит вся картинка:

   1. Структуру держат волосяные линии и воздух, а не рамки и заливки.
   2. Свечения нет нигде. Ни одной box-shadow с цветом — только тень модалки.
   3. Градиентов нет. Плоские заливки.
   4. Скругления 2px и меньше: печать по бумаге не бывает мягкой.
   5. Цвет роли — это данные, а не украшение: он появляется только там, где
      обозначает конкретную роль, и больше нигде.
   6. Заглавные и разрядка — только у логотипа и мелких служебных подписей.
      Сплошной uppercase с letter-spacing — главный признак дешёвого интерфейса.
   7. Бесконечная анимация ровно одна (дуга подбора). CEF считает страницу на CPU,
      каждая лишняя анимация отнимает кадры у самой игры.
   ===================================================================== */

/* CEF рисует в нативных пикселях окна, а не в GUI-пикселях игры. Базовый кегль привязан
   сразу к двум измерениям: по ширине интерфейс не мельчает на 4K, по высоте не вылезает
   за край в низком окне. Всё остальное — в rem, поэтому раскладка масштабируется целиком. */
html { font-size: clamp(12px, min(0.92vw, 1.85vh), 30px); }

:root {
    --ink:      #100E0C;
    --ink-1:    #17130F;
    --ink-2:    #201A15;
    --rule:     rgba(237, 231, 220, 0.11);
    --rule-2:   rgba(237, 231, 220, 0.22);
    --paper:    #EDE7DC;
    --paper-2:  #ABA396;
    --paper-3:  #756E64;
    --seal:     #C8452F;
    --seal-2:   #E05C42;
    --head:     #D2A03F;
    --hands:    #7FA46B;
    --legs:     #6D8FB6;
    --sans: "TWM Sans", system-ui, "Segoe UI", Roboto, sans-serif;
    --mono: "TWM Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --ease: cubic-bezier(0.2, 0, 0, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: var(--sans);
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--paper);
    background: var(--ink);
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
}

/* Единственный фоновый эффект: неподвижное затемнение к краям. Оно не анимируется
   и не стоит ни кадра, но убирает ощущение плоской заливки во весь экран. */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 30% 0%, rgba(200, 69, 47, 0.05), transparent 55%),
                radial-gradient(ellipse at 50% 100%, rgba(0, 0, 0, 0.45), transparent 60%);
}

button, input { font: inherit; color: inherit; background: none; border: 0; outline: none; }
button { cursor: pointer; }
svg { display: block; flex: none; }

::-webkit-scrollbar { width: 0.42rem; }
::-webkit-scrollbar-thumb { background: rgba(237, 231, 220, 0.14); }
::-webkit-scrollbar-thumb:hover { background: rgba(237, 231, 220, 0.24); }
::-webkit-scrollbar-track { background: transparent; }

/* --- Каркас ------------------------------------------------------------- */

.app {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 15.5rem 1fr;
    height: 100vh;
}

.rail {
    display: flex;
    flex-direction: column;
    gap: 1.6rem;
    padding: 1.7rem 1.1rem 1.3rem 1.7rem;
    border-right: 1px solid var(--rule);
    min-height: 0;
}

/* --- Логотип ------------------------------------------------------------ */

/* Знака нет: название набрано словами в две строки и держится только типографикой.
   Печать из трёх черт убрана вместе с ней — она была единственным местом, где вермильон
   занимал площадь, и без неё акцент в интерфейсе остался ровно один. */
.brand { display: flex; align-items: center; }

.brand-word { font-size: 0.82rem; font-weight: 600; letter-spacing: 0.2em; line-height: 1.35; }
.brand-word span { display: block; color: var(--paper-3); font-weight: 400; }

/* --- Навигация ---------------------------------------------------------- */

.nav { display: flex; flex-direction: column; gap: 1px; }

.nav button {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    width: 100%;
    padding: 0.5rem 0.7rem 0.5rem 0.6rem;
    font-size: 0.88rem;
    color: var(--paper-2);
    border-left: 2px solid transparent;
    transition: color 0.12s var(--ease), background 0.12s var(--ease);
}

.nav button:hover { color: var(--paper); background: var(--ink-1); }
.nav button.on { color: var(--paper); border-left-color: var(--seal); background: var(--ink-1); }
.nav button svg { width: 1.05rem; height: 1.05rem; opacity: 0.75; }
.nav button.on svg { opacity: 1; }
.nav .nav-count { margin-left: auto; font-family: var(--mono); font-size: 0.72rem; color: var(--paper-3); }
.nav .nav-dot { margin-left: auto; width: 0.42rem; height: 0.42rem; border-radius: 50%; background: var(--seal); }
.nav-gap { height: 0.9rem; }

/* --- Низ рейки ---------------------------------------------------------- */

.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 0.8rem; }

.me {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    padding-top: 0.9rem;
    border-top: 1px solid var(--rule);
}

.me-name { font-size: 0.85rem; font-weight: 500; }
.me-sub { font-size: 0.72rem; color: var(--paper-3); margin-top: 0.05rem; }
.me-role { display: inline-block; width: 0.4rem; height: 0.4rem; border-radius: 50%; margin-right: 0.35rem; vertical-align: 0.05rem; }

.credit { font-family: var(--mono); font-size: 0.55rem; letter-spacing: 0; white-space: nowrap; color: var(--paper-3); opacity: 0.65; }

/* Подсказка про Esc занимает правый верхний угол — место прежнего крестика. Кнопки закрытия
   больше нет: закрывается меню одной клавишей, и две кнопки об одном действии рядом только
   спорили за внимание. */
.esc { display: flex; align-items: center; gap: 0.45rem; font-size: 0.7rem; color: var(--paper-3); }
.esc b { font-family: var(--mono); font-weight: 400; color: var(--paper-2); border: 1px solid var(--rule-2); padding: 0.05rem 0.35rem; border-radius: 2px; }

/* --- Сцена -------------------------------------------------------------- */

.stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

.stage-head {
    display: flex;
    align-items: flex-end;
    gap: 1rem;
    padding: 1.7rem 2.6rem 1.1rem;
    border-bottom: 1px solid var(--rule);
}

.stage-head h1 { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.015em; line-height: 1.1; }
.stage-head .head-note { font-size: 0.82rem; color: var(--paper-3); padding-bottom: 0.2rem; }
.stage-head .head-actions { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }

.scroll { flex: 1; overflow-y: auto; padding: 1.5rem 2.6rem 2.4rem; min-height: 0; }
.screen { display: none; max-width: 70rem; }
.screen.active { display: block; animation: enter 0.16s var(--ease); }

/* Лобби — единственный экран, который читают всей командой сразу: роли, состав, сложность.
   Ему дан свой масштаб и своя ширина, иначе справа и снизу оставалась пустая треть сцены.
   Масштабируется именно zoom, а не кегль: раскладка держится на rem, и один только шрифт
   растянул бы текст внутри прежних отступов. */
.screen[data-screen="lobby"] { max-width: 76rem; margin-left: auto; margin-right: auto; zoom: 1.08; }

@keyframes enter {
    from { opacity: 0; transform: translateY(0.45rem); }
    to   { opacity: 1; transform: none; }
}

/* --- Общие элементы ----------------------------------------------------- */

.label {
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--paper-3);
}

.block + .block { margin-top: 2.2rem; }
.block-head { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.9rem; }
.block-head .label { flex: none; }
.block-head::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.block-head .btn { order: 1; }

.lede { font-size: 1.02rem; line-height: 1.65; color: var(--paper-2); max-width: 54rem; }
.lede b { color: var(--paper); font-weight: 500; }
.note { font-size: 0.82rem; line-height: 1.6; color: var(--paper-3); }

.empty { padding: 2.4rem 0; text-align: center; color: var(--paper-3); font-size: 0.88rem; line-height: 1.7; }

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    min-height: 2.4rem;
    padding: 0.45rem 1.05rem;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--paper);
    border: 1px solid var(--rule-2);
    border-radius: 2px;
    transition: border-color 0.12s var(--ease), background 0.12s var(--ease), color 0.12s var(--ease);
}

.btn svg { width: 0.95rem; height: 0.95rem; }
.btn:hover { border-color: var(--paper-3); background: var(--ink-2); }

.btn-primary { color: #14100D; background: var(--seal); border-color: var(--seal); font-weight: 600; }
.btn-primary:hover { background: var(--seal-2); border-color: var(--seal-2); color: #14100D; }

.btn-quiet { border-color: transparent; color: var(--paper-2); }
.btn-quiet:hover { border-color: transparent; background: var(--ink-2); color: var(--paper); }

.btn-danger:hover { border-color: var(--seal); color: var(--seal-2); background: transparent; }

.btn:disabled { color: var(--paper-3); border-color: var(--rule); pointer-events: none; }
/* Недоступная главная кнопка гасится до контура, а не притушается прозрачностью:
   залитый вермильон под opacity превращается в грязное пятно с нечитаемой подписью. */
.btn-primary:disabled { background: transparent; }
.btn-wide { width: 100%; }
.btn-lg { min-height: 3.2rem; font-size: 0.98rem; padding: 0.6rem 1.6rem; }
.btn-sm { min-height: 2rem; padding: 0.3rem 0.75rem; font-size: 0.78rem; }

.icon-btn { width: 2.2rem; height: 2.2rem; padding: 0; display: grid; place-items: center; }
.icon-btn svg { width: 1.05rem; height: 1.05rem; }

.tag {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    color: var(--paper-3);
}

.tag svg { width: 0.82rem; height: 0.82rem; }
.tag-lock { color: var(--head); }
.tag-live { color: var(--hands); }
.tag-seal { color: var(--seal-2); }

.code {
    font-family: var(--mono);
    letter-spacing: 0.22em;
    color: var(--paper-2);
}

/* --- Главный экран: строки действий ------------------------------------- */

.acts { border-top: 1px solid var(--rule); }

.act {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    width: 100%;
    padding: 1.75rem 0.9rem 1.75rem 0;
    text-align: left;
    border-bottom: 1px solid var(--rule);
    transition: background 0.12s var(--ease), padding-left 0.14s var(--ease);
}

.act:hover { background: var(--ink-1); padding-left: 0.9rem; }
.act-no { font-family: var(--mono); font-size: 0.72rem; color: var(--paper-3); width: 1.6rem; flex: none; transition: color 0.12s var(--ease); }
.act:hover .act-no { color: var(--seal-2); }
.act-body { flex: 1; min-width: 0; }
.act-name { font-size: 1.5rem; font-weight: 500; letter-spacing: -0.015em; }
.act-desc { margin-top: 0.3rem; font-size: 0.92rem; color: var(--paper-3); }
.act-meta { margin-left: auto; flex: none; font-family: var(--mono); font-size: 0.78rem; color: var(--paper-2); }
.act-go { flex: none; width: 1.35rem; height: 1.35rem; color: var(--paper-3); transition: transform 0.14s var(--ease), color 0.12s var(--ease); }
.act:hover .act-go { transform: translateX(0.28rem); color: var(--paper); }

/* --- Цвет роли ---------------------------------------------------------- */

/* Оттенок вешается на элемент с data-role и наследуется внутрь: цвет здесь обозначает
   конкретную роль, поэтому и живёт он на её карточке, а не в отдельном классе. */
[data-role="head"]  { --tint: var(--head); }
[data-role="hands"] { --tint: var(--hands); }
[data-role="legs"]  { --tint: var(--legs); }

/* --- Подбор ------------------------------------------------------------- */

.queue { display: flex; align-items: center; gap: 1.4rem; padding: 1.6rem 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }

/* Единственная бесконечная анимация страницы. */
.arc { width: 2.6rem; height: 2.6rem; flex: none; position: relative; }
.arc::before, .arc::after { content: ""; position: absolute; inset: 0; border-radius: 50%; }
.arc::before { border: 1px solid var(--rule-2); }
.arc::after { border: 1px solid transparent; border-top-color: var(--seal); animation: turn 2.2s linear infinite; }

@keyframes turn { to { transform: rotate(360deg); } }

.queue-title { font-size: 1.1rem; font-weight: 500; }
.queue-sub { margin-top: 0.15rem; font-size: 0.83rem; color: var(--paper-3); }
.queue .btn { margin-left: auto; }

/* --- Приглашение -------------------------------------------------------- */

.invite {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    padding: 0.95rem 1.1rem;
    border: 1px solid var(--rule-2);
    border-left: 2px solid var(--head);
    border-radius: 2px;
    margin-bottom: 0.6rem;
}

.invite-who { font-size: 0.95rem; font-weight: 500; }
.invite-what { font-size: 0.78rem; color: var(--paper-3); margin-top: 0.1rem; }
.invite .btn { margin-left: 0; }
.invite .invite-actions { margin-left: auto; display: flex; gap: 0.4rem; }

/* --- Список комнат ------------------------------------------------------ */

.filters { display: flex; align-items: center; gap: 1.4rem; padding-bottom: 0.9rem; }

.seg { display: flex; gap: 1.1rem; }
.seg button { font-size: 0.85rem; color: var(--paper-3); padding-bottom: 0.25rem; border-bottom: 1px solid transparent; transition: color 0.12s var(--ease), border-color 0.12s var(--ease); }
.seg button:hover { color: var(--paper-2); }
.seg button.on { color: var(--paper); border-bottom-color: var(--seal); }

.search { display: flex; align-items: center; gap: 0.5rem; flex: 1; max-width: 20rem; border-bottom: 1px solid var(--rule); padding-bottom: 0.3rem; transition: border-color 0.12s var(--ease); }
.search:focus-within { border-bottom-color: var(--rule-2); }
.search svg { width: 0.92rem; height: 0.92rem; color: var(--paper-3); }
.search input { width: 100%; font-size: 0.85rem; }
.search input::placeholder { color: var(--paper-3); }
.filters .btn { margin-left: auto; }

.rooms { border-top: 1px solid var(--rule); }

/* Ширины колонок заданы жёстко, а не по содержимому: каждая строка — отдельный грид,
   и на auto они разъезжаются, превращая список в лесенку. */
.room {
    display: grid;
    grid-template-columns: 4.4rem 1fr 3rem 6.4rem 5.4rem;
    align-items: center;
    gap: 1.2rem;
    padding: 0.85rem 0.9rem 0.85rem 0;
    border-bottom: 1px solid var(--rule);
    transition: background 0.12s var(--ease), padding-left 0.14s var(--ease);
}

.room .room-state { justify-content: flex-end; }
.room > .tag:last-child { justify-content: flex-end; }

.room:hover { background: var(--ink-1); padding-left: 0.9rem; }
.room-code { font-family: var(--mono); font-size: 0.85rem; letter-spacing: 0.12em; color: var(--paper-3); }
.room:hover .room-code { color: var(--paper-2); }
.room-name { font-size: 0.98rem; font-weight: 500; display: flex; align-items: center; gap: 0.45rem; }
.room-sub { margin-top: 0.1rem; font-size: 0.76rem; color: var(--paper-3); }
.room-lock { width: 0.85rem; height: 0.85rem; color: var(--head); }
/* Кнопка входа не прячется до наведения: главное действие строки обязано быть видно
   сразу, наведение только проявляет её рамку. */
.room .btn { border-color: transparent; color: var(--paper-2); }
.room:hover .btn { border-color: var(--rule-2); color: var(--paper); }
.room:hover .btn:hover { border-color: var(--paper-3); background: var(--ink-2); }

.slots { display: flex; gap: 0.22rem; }
.slots i { width: 0.42rem; height: 1.05rem; background: rgba(237, 231, 220, 0.12); }
.slots i.on { background: var(--paper-2); }

/* --- Формы -------------------------------------------------------------- */

.form { display: grid; gap: 1.6rem; max-width: 38rem; }
.form-row { display: grid; gap: 0.5rem; }

.field { display: flex; align-items: center; gap: 0.6rem; border-bottom: 1px solid var(--rule-2); padding-bottom: 0.4rem; transition: border-color 0.12s var(--ease); }
.field:focus-within { border-bottom-color: var(--seal); }
.field input { width: 100%; font-size: 1rem; }
.field input::placeholder { color: var(--paper-3); }
.field .peek { flex: none; display: grid; place-items: center; padding: 0 0.15rem; color: var(--paper-3); transition: color 0.12s var(--ease); }
.field .peek svg { width: 1.05rem; height: 1.05rem; }
.field .peek:hover { color: var(--paper); }

.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }

/* Карточка — <button>, а он центрирует своё содержимое по вертикали: у карточки с более
   коротким описанием заголовок уезжал вниз относительно соседней. Явная колонка это снимает. */
.choice-card {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    padding: 0.95rem 1.05rem;
    text-align: left;
    border: 1px solid var(--rule);
    border-left: 2px solid var(--rule);
    border-radius: 2px;
    transition: border-color 0.12s var(--ease), background 0.12s var(--ease);
}

.choice-card:hover { border-color: var(--rule-2); border-left-color: var(--rule-2); background: var(--ink-1); }
.choice-card.on { border-color: var(--rule-2); border-left-color: var(--seal); background: var(--ink-1); }
.choice-name { font-size: 0.95rem; font-weight: 500; color: var(--paper-2); }
.choice-card.on .choice-name { color: var(--paper); }
.choice-desc { margin-top: 0.35rem; font-size: 0.8rem; line-height: 1.55; color: var(--paper-3); }

/* --- Экран лобби -------------------------------------------------------- */

.lobby-bar { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; padding-bottom: 1.3rem; border-bottom: 1px solid var(--rule); }
.lobby-bar .lobby-title { font-size: 1.35rem; font-weight: 500; }
.lobby-bar .tags { display: flex; align-items: center; gap: 1rem; }
.lobby-bar .lobby-actions { margin-left: auto; display: flex; gap: 0.5rem; }

.roles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }

/* `align-items: stretch` тут обязателен, а не «на всякий случай»: карточка — это <button>,
   а браузерная таблица стилей ставит кнопке `align-items: flex-start`. В колоночном флексе это
   значит, что дети сжимаются по содержимому: длинное описание всё равно занимает всю ширину и
   выглядит правильно, а короткий подвал — нет, и `margin-left: auto` у подсказки «занять»
   упирается в нулевой запас и не двигает её вправо. В свежем Chromium правило другое, поэтому
   в браузере страница выглядела верно, а в CEF — нет. Проверять такие вещи только в браузере
   нельзя: у Chromium внутри MCEF своя, более старая таблица стилей. */
.role {
    position: relative;
    background: var(--ink);
    padding: 1.4rem 1.3rem 1.2rem;
    text-align: left;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    min-height: 100%;
    transition: background 0.12s var(--ease);
}

.role:not(.locked):hover { background: var(--ink-1); }
.role.mine { background: var(--ink-1); }
.role.mine::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--tint); }
.role svg.role-mark { width: 1.6rem; height: 1.6rem; color: var(--tint); }
.role.free svg.role-mark { color: var(--paper-3); }
.role-name { margin-top: 0.75rem; font-size: 1.05rem; font-weight: 500; }
.role-lack { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.1em; color: var(--tint); margin-top: 0.1rem; }
.role.free .role-lack { color: var(--paper-3); }
.role-desc { margin-top: 0.7rem; font-size: 0.8rem; line-height: 1.55; color: var(--paper-3); min-height: 4.2rem; }
.role-foot { margin-top: auto; padding-top: 0.9rem; display: flex; align-items: center; gap: 0.55rem; min-height: 2.6rem; }
.role-occupant { font-size: 0.88rem; font-weight: 500; }
.role-free { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.12em; color: var(--paper-3); }
.role-hint { margin-left: auto; display: flex; align-items: center; gap: 0.35rem; font-size: 0.72rem; color: var(--paper-3); }
.role-hint svg { width: 0.9rem; height: 0.9rem; }

.members { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.6rem 2.6rem; }
.member { display: flex; align-items: center; gap: 0.6rem; }
.member-name { font-size: 0.9rem; font-weight: 500; }
.member-role { font-size: 0.74rem; color: var(--paper-3); margin-top: 0.05rem; }
.member.empty-slot { opacity: 0.4; }

.avatar { width: 1.9rem; height: 1.9rem; border-radius: 2px; background: var(--ink-2); image-rendering: pixelated; object-fit: cover; flex: none; }
.avatar-stub { display: grid; place-items: center; font-size: 0.8rem; font-weight: 500; color: var(--paper-3); }
.avatar-lg { width: 2.4rem; height: 2.4rem; }

/* Настройки забега и старт стоят одним блоком: выбрал сложность — тут же и начал.
   Слева читают (две карточки сложности), справа настраивают и жмут — кулдаун эхо и кнопка
   делят одну колонку, поэтому справа не остаётся пустого поля в половину экрана. */
.lobby-tune { display: flex; align-items: stretch; gap: 2.2rem; }
.lobby-tune .choice { flex: 1.5; min-width: 0; }
.lobby-side { flex: 1; min-width: 17rem; display: flex; flex-direction: column; justify-content: space-between; gap: 1.2rem; }
.lobby-echo .control { margin-top: 0.75rem; }
.lobby-side .start { align-items: stretch; }
.lobby-side .start .btn { width: 100%; min-width: 0; }
.lobby-side .start-hint { text-align: right; }
.lobby-rotate { display: flex; align-items: flex-start; gap: 1.2rem; }
.lobby-rotate > div:first-child { flex: 1; min-width: 0; }
.lobby-rotate .control { flex: none; margin-top: 0.15rem; }

/* Экран итогов. Вердикт крупно, цифры в строку, роли столбцом со стрелкой сдвига —
   читается сверху вниз за один взгляд, как и положено экрану, который смотрят раз. */
/* Ширину сцены экран занимает целиком, как лобби: колонка в 46rem оставляла справа пустую
   треть — тот же дефект, из-за которого расширяли экран лобби. Читаемость держит не ширина
   блока, а ширина текста: у пояснений свой предел строки. */
.sum { width: 100%; }
.sum-sub, .sum-note { max-width: 46rem; }
.sum-verdict { font-size: 2.1rem; line-height: 1.15; letter-spacing: -0.01em; }
.sum-verdict.win { color: var(--seal); }
.sum-sub { margin-top: 0.5rem; font-size: 0.95rem; color: var(--paper-2); }
.sum-dragon {
    margin-top: 0.7rem; display: inline-flex; align-items: center; gap: 0.5rem;
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--seal);
    border: 1px solid var(--seal); border-radius: 2px; padding: 0.25rem 0.6rem;
}
.sum-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.sum-stat { background: var(--ink); padding: 1rem 1.1rem; }
.sum-stat .label { margin-bottom: 0.4rem; }
.sum-stat b { font-family: var(--mono); font-size: 1.5rem; font-weight: 400; }
.sum-roles { display: flex; flex-direction: column; }
.sum-role { display: grid; grid-template-columns: auto 1fr auto auto auto; align-items: center; gap: 0.8rem; padding: 0.75rem 0; }
.sum-role + .sum-role { border-top: 1px solid var(--rule); }
.sum-role .sum-was, .sum-role .sum-will { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; }
.sum-role .sum-will { color: var(--paper); }
.sum-role .sum-was { color: var(--paper-3); }
.sum-arrow { font-family: var(--mono); color: var(--seal); }
.sum-note { margin-top: 1.1rem; font-size: 0.82rem; color: var(--paper-3); }
.sum-actions { margin-top: 2rem; display: flex; justify-content: flex-end; gap: 0.7rem; }
/* Строка от владельца сервера. Отделена цветом печати: это не итог забега, а чужой
   голос на том же экране, и путать их не нужно. */
.sum-announce { color: var(--paper-2); border-left: 1px solid var(--seal);
    padding-left: 0.7rem; }

.start { display: flex; flex-direction: column; align-items: flex-end; gap: 0.6rem; }
.start .btn { min-width: 16rem; }
.start-hint { font-size: 0.83rem; color: var(--paper-3); }

/* --- Настройки ---------------------------------------------------------- */

.setting {
    display: grid;
    grid-template-columns: 1fr minmax(13rem, 19rem);
    align-items: center;
    gap: 2rem;
    padding: 0.8rem 0;
    border-bottom: 1px solid var(--rule);
}

.setting:last-child { border-bottom: 0; }
.setting-name { font-size: 0.9rem; }
.setting-desc { margin-top: 0.12rem; font-size: 0.76rem; color: var(--paper-3); line-height: 1.5; }
.control { display: flex; align-items: center; justify-content: flex-end; gap: 0.8rem; }

/* Клавиша бинда — это <button class="kbd">, а не элемент <kbd>: селектор обязан ловить
   оба, иначе кнопка назначения остаётся голым текстом без рамки. */
kbd, .kbd {
    min-width: 4.6rem;
    padding: 0.3rem 0.7rem;
    text-align: center;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--paper);
    border: 1px solid var(--rule-2);
    border-radius: 2px;
    transition: border-color 0.12s var(--ease), color 0.12s var(--ease);
}

button.kbd:hover { border-color: var(--paper-3); }
.kbd.capturing { color: var(--seal-2); border-color: var(--seal); border-style: dashed; }
.kbd.conflict { color: var(--seal-2); border-color: var(--seal); }

input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, var(--paper-2) var(--fill, 50%), var(--rule-2) var(--fill, 50%));
    cursor: pointer;
}

input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 0.42rem;
    height: 1.05rem;
    border-radius: 1px;
    background: var(--paper);
}

input[type="range"]:hover::-webkit-slider-thumb { background: var(--seal); }
.readout { min-width: 3rem; text-align: right; font-family: var(--mono); font-size: 0.78rem; color: var(--paper-2); }

/* Включённое состояние — залитая дорожка со светлым ползунком. Красный квадратик в пустой
   рамке читался как «стоп», а не как «включено». */
.toggle { position: relative; width: 2.5rem; height: 1.15rem; flex: none; border: 1px solid var(--rule-2); border-radius: 2px; transition: border-color 0.12s var(--ease), background 0.12s var(--ease); }
.toggle::after { content: ""; position: absolute; top: 0.15rem; left: 0.15rem; width: 0.75rem; height: 0.75rem; border-radius: 1px; background: var(--paper-3); transition: left 0.14s var(--ease), background 0.12s var(--ease); }
.toggle:hover { border-color: var(--paper-3); }
.toggle.on { border-color: var(--seal); background: var(--seal); }
.toggle.on::after { left: 1.45rem; background: #14100D; }

.swatches { display: flex; gap: 0.4rem; }
.swatch { width: 1.4rem; height: 1.4rem; border-radius: 1px; border: 1px solid transparent; transition: transform 0.1s var(--ease); position: relative; }
.swatch:hover { transform: translateY(-1px); }
.swatch.on::after { content: ""; position: absolute; inset: -0.32rem; border: 1px solid var(--paper-2); border-radius: 1px; }

/* --- Справка ------------------------------------------------------------ */

/* Справку открывают посреди забега, и своя роль обязана быть первой — искать её среди трёх
   равных колонок некогда. Но чужие роли не прячутся: половина вопросов посреди игры — про
   соседа («почему он меня не слышит»), и ответ на них должен лежать здесь же. Своя карточка
   стоит сверху и помечена, остальные идут за ней в обычном порядке. */

.guide-hero {
    display: grid;
    grid-template-columns: 17rem 1fr 1fr;
    gap: 2.6rem;
    padding: 1.5rem 1.7rem;
    background: var(--ink-1);
    border: 1px solid var(--rule);
    border-left: 2px solid var(--tint, var(--rule-2));
    border-radius: 2px;
}

.guide-hero + .guide-hero { margin-top: 0.8rem; }
.guide-hero.mine { border-color: var(--rule-2); }
.guide-hero svg.role-mark { width: 1.7rem; height: 1.7rem; color: var(--tint, var(--paper-3)); }
.guide-mine { margin-top: 0.6rem; font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--tint, var(--paper-3)); }
.guide-hero h3 { margin-top: 0.75rem; font-size: 1.25rem; font-weight: 500; }
.guide-hero.mine h3 { margin-top: 0.2rem; }
.guide-hero .role-lack { font-size: 0.72rem; }
.guide-lede { margin-top: 0.7rem; font-size: 0.82rem; line-height: 1.6; color: var(--paper-3); }

.guide-facts .label { margin-bottom: 0.6rem; }
.guide-facts li { list-style: none; font-size: 0.82rem; line-height: 1.5; color: var(--paper-2); padding-left: 1rem; position: relative; margin-bottom: 0.5rem; }
.guide-facts li:last-child { margin-bottom: 0; }
.guide-facts li::before { content: ""; position: absolute; left: 0; top: 0.62rem; width: 0.42rem; height: 1px; background: var(--paper-3); }

/* Отнятое — единственное место справки с вермильоном. Это и есть та половина правил,
   которую забывают, и она же объясняет игроку, почему у него «не работает». */
.guide-facts.cant .label { color: var(--seal-2); }
.guide-facts.cant li { color: var(--paper-3); }
.guide-facts.cant li::before { background: var(--seal); }

/* Таблица связи: строка — кто говорит, столбец — кто слышит. Пустая клетка честнее
   прочерка со словом: «не доходит» обязано читаться как дырка в сетке, а не как текст. */
.matrix { display: grid; grid-template-columns: 9rem repeat(3, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.matrix > div { display: flex; align-items: center; gap: 0.5rem; min-height: 3rem; padding: 0.7rem 0.95rem; background: var(--ink); font-size: 0.83rem; }
.matrix .m-corner, .matrix .m-col { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--paper-3); }
.matrix .m-row { font-weight: 500; }
.matrix .m-row i, .matrix .m-col i { width: 0.4rem; height: 0.4rem; border-radius: 1px; background: var(--tint, var(--paper-3)); flex: none; }
.matrix .m-corner { flex-direction: column; align-items: flex-start; gap: 0.12rem; }
.matrix .m-self { background: var(--ink-2); }
.matrix .m-voice { color: var(--paper); }
.matrix .m-thought { color: var(--head); }
.matrix .m-none::before { content: ""; width: 0.8rem; height: 1px; background: var(--seal); }

/* Словарь стоит внутри своих категорий, а не общим списком: в круге его так и выбирают —
   сначала категория, потом слово, — и справка обязана повторять этот путь, иначе она
   учит одному порядку, а игра требует другого. */
.dict-row { display: grid; grid-template-columns: 3.6rem 8.5rem 1fr; align-items: center; gap: 1.1rem; padding: 0.6rem 0; border-bottom: 1px solid var(--rule); }
.dict-row:last-child { border-bottom: 0; }
.dict-key { font-family: var(--mono); font-size: 0.76rem; text-align: center; color: var(--paper-3); border: 1px solid var(--rule-2); border-radius: 2px; padding: 0.16rem 0; }
.dict-name { font-size: 0.85rem; color: var(--paper-2); }
.dict-row.urgent .dict-key { color: var(--seal-2); border-color: var(--seal); }
.dict-row.urgent .dict-name { color: var(--paper); }

.dict { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.dict span { font-family: var(--mono); font-size: 0.73rem; letter-spacing: 0.05em; color: var(--paper-2); border: 1px solid var(--rule); padding: 0.2rem 0.52rem; border-radius: 2px; }
.dict span.hot { color: var(--seal-2); border-color: rgba(200, 69, 47, 0.45); }

/* Тот же маркер, что у списков в карточках ролей: справка должна читаться одним ритмом. */
.notes { display: grid; gap: 0.5rem; }
.notes.after { margin-top: 1.1rem; }
.notes li { list-style: none; font-size: 0.85rem; line-height: 1.5; color: var(--paper-3); padding-left: 0.85rem; position: relative; }
.notes li::before { content: ""; position: absolute; left: 0; top: 0.66rem; width: 0.35rem; height: 1px; background: var(--paper-3); }

.keys { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 2.4rem; }
.key-row { display: flex; align-items: center; gap: 1rem; padding: 0.6rem 0; border-bottom: 1px solid var(--rule); }
.key-row span { font-size: 0.85rem; color: var(--paper-2); }
.key-row .key-who { margin-left: auto; font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.08em; color: var(--paper-3); }

/* --- Круг мыслей -------------------------------------------------------- */

/* Круг занимает экран целиком и подменяет собой всю раскладку с рейкой: мысль отправляют
   в бою, и лишний переход взглядом от навигации к сетке стоит дороже, чем кажется.
   Рейка и заголовок при этом не удаляются из документа, а прячутся — иначе возврат на
   любой другой экран пересобирал бы всё дерево. */
body[data-screen="thoughts"] .app { display: none; }
body[data-screen="thoughts"] .lang { display: none; }

/* Круг открывает только Голова, а она — единственный глаз команды: затемнённый экран на
   время выбора мысли ослепляет разом всех троих, и мысль приходится слать вслепую как раз
   тогда, когда смотреть нужнее всего. Поэтому страница круга прозрачна целиком — ни фона,
   ни виньетки, ни затемняющей подложки. Читаемость держат заливки самих секторов, а тем
   подписям, что стоят вне кольца на голом мире, дана тень. */
body[data-screen="thoughts"] { background: transparent; }
body[data-screen="thoughts"]::before { display: none; }

.wheel {
    position: fixed;
    inset: 0;
    z-index: 15;
    display: none;
    place-items: center;
    background: transparent;
}

body[data-screen="thoughts"] .wheel { display: grid; }

.wheel-stage { position: relative; width: min(80vh, 80vw); height: min(80vh, 80vw); }
.wheel-stage svg { width: 100%; height: 100%; overflow: visible; }

/* Дуги секторов. Заливка появляется только под курсором: невыбранный сектор держится
   волосяной линией, как и всё остальное в интерфейсе. */
.wheel-sector { fill: rgba(16, 14, 12, 0.84); stroke: var(--rule); stroke-width: 1.4; }
.wheel-sector.on { fill: var(--ink-2); stroke: var(--rule-2); }
.wheel-sector.urgent.on { fill: rgba(59, 33, 25, 0.94); stroke: var(--seal); }

/* Незанятая позиция сетки. Пунктир вместо сплошной линии: место в круге есть, мысли в нём
   нет — и попасть в него нельзя. Прятать такие позиции нельзя, иначе стороны света съезжают
   с середин секторов на стыки дуг, и курсор, посланный точно вправо, выбирает соседа. */
.wheel-sector.empty { fill: rgba(16, 14, 12, 0.5); stroke-dasharray: 3 6; }

.wheel-label {
    fill: var(--paper-2);
    font-family: var(--sans);
    font-size: 27px;
    font-weight: 500;
    letter-spacing: 0.02em;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
}

.wheel-label.on { fill: var(--paper); }
.wheel-label.small { font-size: 22px; }
.wheel-label.big { font-size: 40px; }
.wheel-label.urgent { fill: var(--seal-2); font-weight: 600; font-size: 30px; }
.wheel-label.urgent.on { fill: #F2E4DF; }

/* Номер клавиши у внешнего края: он и подсказка, и разметка круга. */
.wheel-key {
    fill: var(--paper-3);
    font-family: var(--mono);
    font-size: 19px;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
}

.wheel-key.on { fill: var(--seal-2); }

/* Треугольник у группы: он говорит «здесь ещё уровень» без единого слова. */
.wheel-more { fill: var(--paper-3); pointer-events: none; }
.wheel-more.on { fill: var(--seal-2); }

.wheel-hub-line { stroke: var(--rule); stroke-width: 1.4; fill: none; pointer-events: none; }

/* Подложка под серединой. Между ступицей и внутренним краем кольца остаётся зазор, который
   ничей сектор не закрывает: на затемнённом экране его не было видно, а на прозрачном он
   светился кольцевым ореолом и отрывал середину от круга. */
.wheel-well { fill: rgba(16, 14, 12, 0.84); stroke: none; pointer-events: none; }

.wheel-title {
    position: absolute;
    top: -3.4rem;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.78rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--paper-3);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
}

.wheel-hint {
    position: absolute;
    bottom: -3.2rem;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 1.4rem;
    font-size: 0.76rem;
    color: var(--paper-3);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
}

.wheel-hint b {
    font-family: var(--mono);
    font-weight: 400;
    color: var(--paper-2);
    background: rgba(16, 14, 12, 0.84);
    border: 1px solid var(--rule-2);
    border-radius: 2px;
    padding: 0.05rem 0.34rem;
    margin-right: 0.4rem;
}

/* --- Обучение ----------------------------------------------------------- */

/* Показывается в начале каждого забега и подменяет собой всю раскладку — как круг мыслей,
   и по той же причине: в этот момент от интерфейса нужна ровно одна мысль за раз, а рейка
   с навигацией предлагает уйти куда угодно ещё.

   Половина экрана отдана схеме. Правила ролей несимметричны и звучат как исключения:
   картинка снимает половину текста, а вторую делает короче. Схема у каждого шага своя —
   одна и та же на всех пяти шагах перестаёт читаться уже на третьем, глаз её пролистывает. */
body[data-screen="tutorial"] .app { display: none; }
body[data-screen="tutorial"] .lang { display: none; }

.tutor {
    position: fixed;
    inset: 0;
    z-index: 16;
    display: none;
    flex-direction: column;
    background: var(--ink);
    padding: 2.2rem 3rem 1.8rem;
}

body[data-screen="tutorial"] .tutor { display: flex; }

.tutor-top {
    display: flex;
    align-items: baseline;
    gap: 0.9rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--rule);
}

.tutor-eyebrow { font-size: 0.72rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--paper-3); }
.tutor-role { display: flex; align-items: baseline; gap: 0.5rem; font-size: 1.02rem; font-weight: 600; }
.tutor-role .role-lack { font-size: 0.8rem; font-weight: 400; color: var(--paper-3); }
.tutor-top .btn { margin-left: auto; align-self: center; }

/* Схема и текст стоят парой по центру экрана с ограниченной общей шириной, а не двумя
   колонками во всю ширину: колонка в половину 4K оставляет между ними пустое поле в
   ладонь, и связь картинки с абзацем, который её объясняет, теряется. */
.tutor-body {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4rem;
    padding: 1.2rem 0;
}

.tutor-stage { flex: 0 0 30rem; height: 100%; max-height: 30rem; display: grid; place-items: center; }
.tutor-stage svg { width: 100%; height: 100%; max-height: 30rem; overflow: visible; }

.tutor-text { flex: 0 1 30rem; display: flex; flex-direction: column; gap: 0.9rem; min-width: 0; }
.tutor-count { font-family: var(--mono); font-size: 0.74rem; color: var(--paper-3); letter-spacing: 0.08em; }
.tutor-title { font-size: 1.55rem; font-weight: 600; line-height: 1.2; }
.tutor-desc { font-size: 0.97rem; line-height: 1.7; color: var(--paper-2); }

.tutor-desc b {
    font-family: var(--mono);
    font-weight: 400;
    color: var(--paper);
    border: 1px solid var(--rule-2);
    border-radius: 2px;
    padding: 0.05rem 0.36rem;
    white-space: nowrap;
}

/* Переход между шагами конечный и короткий: он говорит «это уже другой экран», но не
   заставляет ждать. Схема только проявляется, без сдвига, — узлы кольца связи обязаны
   стоять на месте от шага к шагу, а поехавшая картинка это ощущение ломает. */
@keyframes tutor-rise { from { opacity: 0; transform: translateY(0.55rem); } to { opacity: 1; transform: none; } }
@keyframes tutor-fade { from { opacity: 0; } to { opacity: 1; } }

.tutor-text { animation: tutor-rise 0.2s var(--ease) both; }
.tutor-stage { animation: tutor-fade 0.26s var(--ease) both; }

.tutor-foot { display: flex; align-items: center; gap: 0.9rem; padding-top: 1rem; border-top: 1px solid var(--rule); }
.tutor-dots { display: flex; gap: 0.42rem; }

.tutor-dots i {
    display: block;
    width: 1.5rem;
    height: 2px;
    background: var(--rule-2);
    cursor: pointer;
}

.tutor-dots i.on { background: var(--seal); }
.tutor-dots i.seen { background: var(--paper-3); }
.tutor-foot .tutor-nav { margin-left: auto; display: flex; gap: 0.6rem; }

/* --- Схемы обучения ----------------------------------------------------- */

/* Восемь картинок держатся на одном наборе примитивов, и это не аккуратность ради
   аккуратности: разойдись у них толщина линии или кегль подписи — пять шагов подряд
   выглядели бы нарисованными разными людьми. Все схемы живут в одном вьюбоксе 120×120,
   поэтому кегль в них сравним между собой и со страницей: при стороне сцены в 25rem
   единица вьюбокса — примерно три пикселя. */
.tutor-stage text { font-family: var(--sans); text-anchor: middle; dominant-baseline: middle; }

.fig-faint { fill: none; stroke: var(--rule); stroke-width: 0.34; }
.fig-rule  { fill: none; stroke: var(--rule-2); stroke-width: 0.34; }
.fig-line  { fill: none; stroke: var(--paper-3); stroke-width: 0.7; stroke-linecap: round; stroke-linejoin: round; }
.fig-plate { fill: var(--ink-1); stroke: var(--rule-2); stroke-width: 0.34; }
.fig-ink   { fill: var(--ink); }

.fig-name  { fill: var(--paper); font-size: 4.4px; font-weight: 600; }
.fig-label { fill: var(--paper-2); font-size: 3.8px; }
.fig-sub   { fill: var(--paper-3); font-size: 3.2px; }
.fig-key   { fill: var(--paper-3); font-family: var(--mono); font-size: 3px; letter-spacing: 0.08em; }
.tutor-stage text.fig-left { text-anchor: start; }

/* Цвет роли — данные, а не украшение: он появляется только там, где обозначает роль,
   и задаётся один раз через color, чтобы линии, глифы и подписи взяли его сами. */
.fig-role[data-role="head"]  { color: var(--head); }
.fig-role[data-role="hands"] { color: var(--hands); }
.fig-role[data-role="legs"]  { color: var(--legs); }
.fig-role.dim { color: var(--paper-3); }
.fig-role .fig-line { stroke: currentColor; }
.fig-role .fig-name { fill: currentColor; }

/* Кольцо связи. Узлы стоят в вершинах равностороннего треугольника и не переставляются
   никогда: гаснут только связи. Иначе на каждом шаге глаз заново ищет, где что. */
.tutor-node { color: var(--paper-3); }
.tutor-node.self { color: var(--paper-2); }
.tutor-node.on[data-role="head"]  { color: var(--head); }
.tutor-node.on[data-role="hands"] { color: var(--hands); }
.tutor-node.on[data-role="legs"]  { color: var(--legs); }

.tutor-node circle { fill: var(--ink-1); stroke: var(--rule-2); stroke-width: 0.4; }
.tutor-node.self circle { stroke: currentColor; stroke-width: 0.5; }
.tutor-node.on circle { stroke: currentColor; stroke-width: 0.75; }
.tutor-node .tutor-glyph { fill: none; stroke: currentColor; stroke-width: 1.5; }
.tutor-node text { fill: currentColor; }
.tutor-node .tutor-node-lack { fill: var(--paper-3); }

/* Связи — прямые со сдвигом вбок, а не дуги. Дуга гнулась к середине и наезжала на
   соседнюю связь вместе с подписью; сдвиг разводит встречную пару по разные стороны
   ребра сам, потому что нормаль считается от направления связи. */
.tutor-edge { color: var(--rule-2); }
.tutor-edge.on[data-from="head"]  { color: var(--head); }
.tutor-edge.on[data-from="hands"] { color: var(--hands); }
.tutor-edge.on[data-from="legs"]  { color: var(--legs); }
.tutor-edge.off { color: var(--seal); }

.tutor-edge path { fill: none; stroke: currentColor; stroke-width: 0.4; }
.tutor-edge polygon { fill: currentColor; }
.tutor-edge text { fill: var(--paper-3); font-size: 3.2px; }
.tutor-edge rect { fill: var(--ink); }

.tutor-edge.on path { stroke-width: 0.8; }
.tutor-edge.on text { fill: var(--paper-2); }

/* Мысль — пунктир: она не звук, и путать её со звуком нельзя. */
.tutor-edge.thought path { stroke-dasharray: 2.4 1.8; }

/* Запрет. Единственное место схемы с вермильоном — и оно того стоит: «сюда не доходит»
   и есть та половина правил, которую забывают, и именно она объясняет тишину в наушниках. */
.tutor-edge.off path { stroke-width: 0.6; stroke-dasharray: 1.4 2; }
.tutor-edge.off polygon { fill: none; stroke: currentColor; stroke-width: 0.4; }
.tutor-edge.off text { fill: var(--seal-2); }
.tutor-edge .tutor-cross { stroke: var(--seal); stroke-width: 0.6; stroke-linecap: round; }

/* Живой мини-круг. Единственная бесконечная анимация страницы после дуги подбора, и она
   заменяет собой абзац: «сначала категория, потом слово» показывается за один оборот.
   Шаг курсора и вспышка сектора синхронны намеренно — обе завязаны на один цикл в 10 с. */
.fig-wheel-sector { fill: rgba(23, 19, 15, 0.55); stroke: var(--rule); stroke-width: 0.34; }
.fig-wheel-lit { fill: var(--ink-2); stroke: var(--rule-2); stroke-width: 0.34; opacity: 0; animation: fig-lit 10s linear infinite; }
.fig-wheel-hand { transform-box: view-box; transform-origin: 60px 58px; animation: fig-scan 10s steps(5) infinite; }
.fig-wheel-hand polygon { fill: var(--seal); }
.fig-wheel-urgent { fill: rgba(23, 19, 15, 0.55); stroke: rgba(200, 69, 47, 0.32); stroke-width: 0.34; }
.fig-wheel-label { fill: var(--paper-2); font-size: 3.4px; }
.fig-wheel-urgent-label { fill: var(--seal-2); font-size: 3.6px; font-weight: 600; }

@keyframes fig-scan { to { transform: rotate(360deg); } }
@keyframes fig-lit { 0%, 17% { opacity: 1; } 19%, 100% { opacity: 0; } }

/* Восприятие: обзор рук и эхолокация ног показаны сверху, одной и той же рамкой.
   Это сравнение — у одних круг света в пять блоков, у других расходящийся фронт, — и
   в разных проекциях оно бы не читалось. */
.fig-seen { fill: rgba(237, 231, 220, 0.05); stroke: var(--rule-2); stroke-width: 0.34; }
.fig-lost { fill: none; stroke: rgba(237, 231, 220, 0.07); stroke-width: 0.5; }
.fig-wave { fill: none; stroke: var(--legs); stroke-width: 0.45; }
.fig-echo { fill: none; stroke: var(--legs); stroke-width: 0.5; }
.fig-arc  { fill: none; stroke: var(--hands); stroke-linecap: round; }

/* Карточка мысли повторяет HUD один в один, включая цвет группы и полоску жизни: ноги
   увидят её через минуту в игре и обязаны узнать, а не разгадывать заново. */
.fig-card { fill: rgba(9, 8, 7, 0.97); stroke: var(--rule-2); stroke-width: 0.34; }
.fig-card-label { font-size: 7px; font-weight: 600; fill: #CFE0EE; }
.fig-card-label.urgent { fill: var(--seal-2); }
.fig-card.urgent { stroke: rgba(224, 92, 66, 0.55); }
.fig-card-life { fill: var(--legs); }
.fig-card-life.urgent { fill: var(--seal); }
.fig-card-old { fill: rgba(9, 8, 7, 0.97); stroke: var(--rule); stroke-width: 0.34; }
.fig-card-old-label { font-size: 3.6px; font-weight: 600; fill: var(--paper-3); }

@media (max-aspect-ratio: 1/1) {
    .tutor { padding: 1.6rem 1.4rem; }
    .tutor-body { flex-direction: column; gap: 1.2rem; }
    .tutor-stage { flex: 0 0 auto; width: 100%; max-height: 22rem; }
    .tutor-stage svg { max-height: 22rem; }
    .tutor-text { flex: 0 0 auto; max-width: 36rem; }
    .tutor-title { font-size: 1.3rem; }
}

/* --- Переключатель языка ------------------------------------------------ */

/* Правый нижний угол — единственное место, свободное на каждом экране: слева рейка,
   сверху заголовок с действиями, справа сверху тоасты. */
.lang {
    position: fixed;
    right: 1.5rem;
    bottom: 1.3rem;
    z-index: 25;
}

/* Флаг — прямоугольник с волосяной обводкой, как и всё остальное в интерфейсе.
   Заливки в нём настоящие: это единственное место, где цвет обозначает не роль. */
.flag {
    width: 1.15rem;
    height: 0.8rem;
    flex: none;
    border: 1px solid var(--rule-2);
    border-radius: 1px;
}

.lang button {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.34rem 0.6rem;
    font-size: 0.76rem;
    letter-spacing: 0.06em;
    color: var(--paper-3);
    border-radius: 2px;
    transition: color 0.12s var(--ease), background 0.12s var(--ease);
}

.lang button:hover { color: var(--paper-2); }

.lang-current {
    background: var(--ink-1);
    border: 1px solid var(--rule);
}

.lang-current svg:last-child {
    width: 0.8rem;
    height: 0.8rem;
    color: var(--paper-3);
    transition: transform 0.14s var(--ease);
}

.lang.open .lang-current svg:last-child { transform: rotate(180deg); }

/* Список раскрывается вверх: вниз ему некуда — он и так стоит у нижнего края. */
.lang-list {
    position: absolute;
    right: 0;
    bottom: calc(100% + 0.3rem);
    display: none;
    flex-direction: column;
    min-width: 100%;
    padding: 0.16rem;
    background: var(--ink-1);
    border: 1px solid var(--rule);
    border-radius: 2px;
}

.lang.open .lang-list { display: flex; }

.lang-list button { white-space: nowrap; }
.lang-list button.on { color: var(--paper); background: var(--ink-2); }

/* --- Тоасты ------------------------------------------------------------- */

/* Стопка мышь не ловит — иначе прозрачная колонка во всю высоту угла съедала бы клики по
   тому, что под ней. Мышь ловят сами карточки, ради крестика. */
.toasts { position: fixed; top: 1.4rem; right: 1.6rem; z-index: 20; display: flex; flex-direction: column; gap: 0.5rem; pointer-events: none; }

.toast {
    position: relative;
    min-width: 17rem;
    max-width: 25rem;
    padding: 0.75rem 2.4rem 0.75rem 1rem;
    background: var(--ink-1);
    border: 1px solid var(--rule-2);
    border-left: 2px solid var(--paper-3);
    border-radius: 2px;
    pointer-events: auto;
    animation: toast-in 0.16s var(--ease);
}

/* Пять секунд — это долго, когда тоаст закрывает угол, в который смотришь. Крестик стоит
   в поле, отведённом ему правым отступом карточки: наезжать на текст он не должен. */
.toast-close {
    position: absolute;
    top: 0.45rem;
    right: 0.45rem;
    display: grid;
    place-items: center;
    padding: 0.28rem;
    border-radius: 2px;
    color: var(--paper-3);
    transition: color 0.12s var(--ease), background 0.12s var(--ease);
}

.toast-close:hover { color: var(--paper); background: var(--ink-2); }
.toast-close svg { width: 0.78rem; height: 0.78rem; }

.toast.out { animation: toast-out 0.2s var(--ease) forwards; }
.toast-title { font-size: 0.85rem; font-weight: 500; }
.toast-text { margin-top: 0.15rem; font-size: 0.78rem; color: var(--paper-3); line-height: 1.5; }
.toast[data-kind="success"] { border-left-color: var(--hands); }
.toast[data-kind="warning"] { border-left-color: var(--head); }
.toast[data-kind="error"]   { border-left-color: var(--seal); }
.toast[data-kind="invite"]  { border-left-color: var(--head); }

@keyframes toast-in  { from { opacity: 0; transform: translateX(0.9rem); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateX(0.9rem); } }

/* --- Модалка ------------------------------------------------------------ */

.modal-root { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; background: rgba(8, 6, 5, 0.78); }
.modal-root.open { display: grid; }

.modal {
    width: min(30rem, 88vw);
    padding: 1.6rem;
    background: var(--ink-1);
    border: 1px solid var(--rule-2);
    border-radius: 2px;
    box-shadow: 0 1.6rem 4rem rgba(0, 0, 0, 0.6);
    animation: enter 0.16s var(--ease);
}

.modal h3 { font-size: 1.1rem; font-weight: 500; }
.modal p { margin-top: 0.4rem; font-size: 0.85rem; color: var(--paper-3); line-height: 1.6; }
.modal-body { margin-top: 1.2rem; display: grid; gap: 0.7rem; }
.modal-actions { margin-top: 1.4rem; display: flex; gap: 0.6rem; }
.modal-actions .btn { flex: 1; }
.modal-error { font-size: 0.8rem; color: var(--seal-2); min-height: 1.1rem; }

.pick { max-height: 16rem; overflow-y: auto; display: flex; flex-direction: column; }
.pick-row { display: flex; align-items: center; gap: 0.7rem; padding: 0.55rem 0; border-bottom: 1px solid var(--rule); }
.pick-row span { font-size: 0.9rem; }
.pick-row .btn { margin-left: auto; }

/* --- Узкое окно --------------------------------------------------------- */

@media (max-aspect-ratio: 1/1) {
    .app { grid-template-columns: 4.4rem 1fr; }
    .rail { padding: 1.2rem 0.5rem; align-items: center; }
    /* Логотип в узкой рейке исчезает целиком: он теперь только слово, а слово в 4.4rem
       не помещается. Знака, который мог бы остаться вместо него, больше нет. */
    .brand, .nav button span, .me > div { display: none; }
    .nav button { justify-content: center; padding: 0.6rem 0; border-left: 0; border-bottom: 2px solid transparent; }
    .nav button.on { border-bottom-color: var(--seal); }
    .nav .nav-count, .nav .nav-dot { display: none; }
    .stage-head, .scroll { padding-left: 1.4rem; padding-right: 1.4rem; }
    .roles { grid-template-columns: 1fr; }
    .keys { grid-template-columns: 1fr; }
    .guide-hero { grid-template-columns: 1fr; gap: 1.4rem; }
    .matrix { grid-template-columns: 6.5rem repeat(3, 1fr); }
    .matrix > div { padding: 0.6rem 0.5rem; font-size: 0.76rem; }
    .dict-row { grid-template-columns: 3.6rem 1fr; gap: 0.6rem 0.9rem; }
    .dict-row .dict { grid-column: 1 / -1; }
    .choice { grid-template-columns: 1fr; }
    .setting { grid-template-columns: 1fr; gap: 0.6rem; }
    .control { justify-content: flex-start; }
    .wheel-stage { width: min(86vh, 92vw); height: min(86vh, 92vw); }
    .lang { right: 0.9rem; bottom: 0.9rem; }
    .room { grid-template-columns: 3.4rem 1fr auto; }
    .room .slots, .room .room-state { display: none; }
    .room .btn { visibility: visible; }
}

            "tutor.head.1.t": "Вы — Голова",
            "tutor.head.1.d": "Вы видите мир целиком и слышите обоих напарников. Камера привязана к Ногам и смотрит туда, куда они идут. Клавиша {free_look} на время отдаёт обзор вам: держите — смотрите куда хотите, отпустили — камера снова за Ногами.",

            "tutor.hands.3.d": "Ноги читают мир эхолокацией и ведут тело, поэтому маршрут и порядок действий приходят от них. Отвечать им бесполезно: Ноги глухие, ваш голос доходит до одной Головы. Ей и рассказывайте, что у вас в руках и что не выходит — она видит всё и передаст дальше.",

            "tutor.hands.4.d.easy": "У прицела появляется дуга. Сторона показывает, откуда пришёл звук, толщина — насколько близко источник, а цвет со значком говорят про его род: свои отметки есть у шага, работы с блоками, живых существ и урона. Держится дуга около секунды, поэтому смотреть на неё нужно сразу.",

            "tutor.legs.2.t": "Зрение заменяет эхо",
            "tutor.legs.2.d.easy": "Обычного зрения у вас нет. Волна расходится от тела и обводит контуром поверхности, до которых достала, а со временем контуры гаснут. На лёгкой волны идут непрерывно, так что картинка обновляется сама и можно просто идти.",
            "tutor.legs.2.d.hard": "Обычного зрения у вас нет. Волна расходится от тела и обводит контуром поверхности, до которых достала, а со временем контуры гаснут. На сложной волну даёт каждый шаг, а дальний обзор — {ping} с кулдауном. Пока вы стоите, картинка гаснет полностью.",

            "tutor.head.1.t": "You are the Head",
            "tutor.head.1.d": "You see the whole world and hear both teammates. The camera is tied to the Legs and looks where they walk. The {free_look} key lends the view to you: hold it and look wherever you want, release it and the camera goes back to the Legs.",
            "tutor.head.2.t": "You do not speak",
            "tutor.head.2.d": "No microphone, no chat. What is left is the thought, and only the Legs receive it. Nothing reaches the Hands from you directly — the Legs will tell them, if you ask.",
            "tutor.head.3.t": "The thought wheel",
            "tutor.head.3.d": "The wheel opens on {thoughts}. The first digit picks a category, the second picks a thought inside it; the mouse works the same way, the wheel reads the direction of the cursor. <b>Z</b>, <b>X</b> and <b>C</b> send «ATTACK!», «STOP!» and «RUN!» from any level, so you never climb back up for them.",
            "tutor.head.4.t": "How messages travel",
            "tutor.head.4.d": "The thought goes from you to the Legs, the Legs pass it to the Hands by voice, the Hands answer you by voice as well. There is no way around it, so word your request to the Hands in something the Legs can repeat out loud.",
            "tutor.head.5.t": "What only you can see",
            "tutor.head.5.d": "Health, armour and hunger exist on your screen alone: the Hands keep a hotbar, the Legs do not even have that. The body's death ends the run for all three, so you watch the bars and send «HEALTH» or «STOP!» early. <b>Q</b> makes the body drop the item in its hand — that is everything you can do with items.",

            "tutor.hands.1.t": "You are the Hands",
            "tutor.hands.1.d": "The team's body is yours: the inventory, the health and hunger bars, every point of damage taken. Breaking, placing, crafting, eating and fighting are yours alone as well. The Head and the Legs never touch the world, they advise.",
            "tutor.hands.2.t": "Five blocks of sight",
            "tutor.hands.2.d": "Past five blocks you see nothing at all. There is no sky and no horizon for you, so neither the compass direction nor the time of day can be worked out. The camera follows the Legs; {free_look} lends it to you, but the range stays the same.",
            "tutor.hands.3.t": "The Legs say where to go",
            "tutor.hands.3.d": "The Legs read the world by echo and steer the body, so the route and the order of actions come from them. Answering them is pointless: the Legs are deaf, and your voice reaches the Head alone. Tell the Head what you are holding and what is not working — it sees everything and will pass it on.",
            "tutor.hands.4.t": "How to read sounds",
            "tutor.hands.4.d.easy": "An arc appears at the crosshair. Its side shows where the sound came from, its thickness how close the source is, and the colour with the glyph say what kind it was: steps, work on blocks, living things and damage each have their own mark. The arc holds for about a second, so look at it right away.",
            "tutor.hands.4.d.hard": "On hard there are no arcs, only the sound in your headphones. A step going past, a door creaking, a hiss behind you all come through, but the direction and the distance are yours to work out.",
            "tutor.hands.5.t": "You have no bars",
            "tutor.hands.5.d": "Health and hunger are gone from your screen, the hotbar stays: the Head watches the bars and warns you through the Legs. The body's death ends the run for everyone, so react to «STOP!» and «RUN!» first and ask why afterwards.",

            "tutor.legs.1.t": "You are the Legs",
            "tutor.legs.1.d": "Walking, sprinting, jumping and crouching rest on you, and nobody else can move the body. The route is yours in the end, even when the Head sends a direction. In exchange your screen holds no inventory, no health and no hunger: echolocation takes all of it.",
            "tutor.legs.2.t": "Echo instead of sight",
            "tutor.legs.2.d.easy": "You have no ordinary sight. A wave spreads from the body and outlines the surfaces it reached, and those outlines fade with time. On easy the waves run continuously, so the picture refreshes itself and you can simply walk.",
            "tutor.legs.2.d.hard": "You have no ordinary sight. A wave spreads from the body and outlines the surfaces it reached, and those outlines fade with time. On hard every step makes a wave, and the far view is {ping} with a cooldown. Stand still and the picture goes out completely.",
            "tutor.legs.3.t": "You hear nothing",
            "tutor.legs.3.d": "The sounds of the world are absent for you: no footsteps, no explosion, no hiss behind your back. Your teammates' voices do not get through either, and that is the role rather than a broken microphone. Speaking is free for you, and both the Head and the Hands hear it.",
            "tutor.legs.4.t": "Thoughts from the Head",
            "tutor.legs.4.d": "The Head answers with a card at the bottom of your screen instead of a voice: a word, a direction glyph and a bar of the time it has left. Red marks the urgent ones — «ATTACK!», «STOP!» and «RUN!» are carried out without waiting for an explanation.",
            "tutor.legs.5.t": "All communication runs through you",
            "tutor.legs.5.d": "The Head sends a thought to you, you pass it to the Hands, the Hands answer the Head. Only your voice reaches the Hands and the Head has no way of its own, so silent Legs stop the team. The run ends for all three at once, so say the urgent things out loud even in a hurry.",

            "lang.title": "Interface language"
        }
    };

       интерфейсе заметить труднее, чем странную строку. */
    function t(key) {
        var table = I18N[state.lang] || I18N.ru;
        var value = table[key];
        if (value === undefined) { value = I18N.ru[key]; }
        if (value === undefined) { return key; }
        for (var i = 1; i < arguments.length; i++) {
            value = value.replace("%s", arguments[i]);
        }
        return value;
    }

    function icon(name, className) {
        var node = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        node.setAttribute("viewBox", "0 0 24 24");
        node.setAttribute("fill", "none");
        node.setAttribute("stroke", "currentColor");

        node.setAttribute("stroke-linecap", "round");

        return node;
